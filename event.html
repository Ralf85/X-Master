<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Võistlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a1512; --bg-panel: #0f1e1a; --bg-panel-2: #142c25;
    --ink: #eaf2ee; --ink-dim: #7fa396; --ink-faint: #4d6a60;
    --line: rgba(234, 242, 238, 0.09); --accent: #ff6b35;
    --birdie: #4fbf82; --bogey: #e8974a; --double: #d9534f;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-deep); color: var(--ink); font-family: var(--font-body); min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
  h2 { font-family: var(--font-display); font-size: 13px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 0 10px; }
  .back-link { color: var(--ink-faint); font-size: 12px; text-decoration: none; }
  .meta { color: var(--ink-dim); font-size: 13px; margin-bottom: 4px; }
  .status-pill { font-size: 10.5px; font-family: var(--font-display); font-weight: 700; padding: 4px 10px; border-radius: 100px; text-transform: uppercase; }
  .status-pill.registration_open { background: rgba(79,191,130,0.15); color: var(--birdie); }
  .status-pill.registered, .status-pill.live { background: rgba(255,107,53,0.15); color: var(--accent); }
  .status-pill.confirmed { background: rgba(79,191,130,0.25); color: var(--birdie); }
  .reg-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .reg-row:last-child { border-bottom: none; }
  .empty-note { color: var(--ink-faint); font-size: 13px; }
  .btn { background: var(--accent); color: #1a0e08; border: none; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; padding: 9px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.secondary { background: var(--bg-panel-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.full { width: 100%; text-align: center; margin-top: 8px; }
  .pool-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .pool-box.mine { border-color: var(--accent); background: rgba(255,107,53,0.06); }
  .pool-head { display: flex; justify-content: space-between; align-items: center; }
  .pool-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
  .pool-count { font-size: 11.5px; color: var(--ink-faint); }
  .pool-members { font-size: 12.5px; color: var(--ink-dim); margin-top: 6px; }
  .error-msg { color: var(--double); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const token = localStorage.getItem('dg_player_token');
const app = document.getElementById('app');
let state = { event: null, divisions: [], rounds: [], registrations: [], myRegistration: null, poolsByRound: {} };

async function load() {
  app.innerHTML = `<div class="card">Laen...</div>`;
  const res = await fetch(`/api/events/${slug}`);
  if (!res.ok) { app.innerHTML = `<div class="card">Võistlust ei leitud.</div>`; return; }
  const data = await res.json();
  state.event = data.event; state.divisions = data.divisions; state.rounds = data.rounds; state.registrations = data.registrations;

  if (token) {
    const myRes = await fetch('/api/registrations', { headers: { Authorization: `Bearer ${token}` } });
    if (myRes.ok) {
      const myData = await myRes.json();
      state.myRegistration = myData.registrations.find((r) => r.event_id === state.event.id) || null;
    }
  }

  if (token) {
    for (const round of state.rounds) {
      const pRes = await fetch(`/api/pools/round/${round.id}`, { headers: { Authorization: `Bearer ${token}` } });
      if (pRes.ok) state.poolsByRound[round.id] = await pRes.json();
    }
  }

  render();
}

function render() {
  app.innerHTML = `
    <a class="back-link" href="/dashboard">← Minu konto</a>
    <h1>${state.event.name}</h1>
    <div class="meta">${state.event.location || ''} ${state.event.start_date ? '· ' + new Date(state.event.start_date).toLocaleDateString('et-EE') : ''}</div>
    <span class="status-pill ${state.event.status}">${state.event.status.replace('_',' ')}</span>

    ${!token ? `<div class="card" style="margin-top:16px;">Logi sisse, et registreeruda või pooli valida. <a href="/dashboard" class="btn small" style="margin-top:8px;">Mine kontole</a></div>` : ''}

    ${token && !state.myRegistration && state.event.status === 'registration_open'
      ? `<div class="card" style="margin-top:16px;">Sa pole veel registreerunud. <a href="/dashboard" class="btn full">Registreeru dashboardil</a></div>` : ''}

    <h2>Registreerunud mängijad (${state.registrations.length})</h2>
    <div class="card">
      ${state.registrations.length === 0 ? '<div class="empty-note">Registreerumisi pole veel.</div>' :
        state.registrations.map((r) => `<div class="reg-row"><span>${r.first_name} ${r.last_name} · ${r.division_name}</span><span class="status-pill ${r.status}">${r.status}</span></div>`).join('')}
    </div>

    ${token ? state.rounds.map(renderRoundPools).join('') : ''}
  `;

  document.querySelectorAll('[data-join]').forEach((btn) => btn.onclick = () => joinPool(btn.dataset.join, btn.dataset.round));
  document.querySelectorAll('[data-leave]').forEach((btn) => btn.onclick = () => leavePool(btn.dataset.leave, btn.dataset.round));
}

function renderRoundPools(round) {
  const poolData = state.poolsByRound[round.id];
  if (!poolData || poolData.pools.length === 0) {
    return `<h2>${round.name || 'Round ' + round.round_number} — Poolid</h2><div class="card empty-note">Poole pole veel avatud.</div>`;
  }
  const myPoolId = poolData.myPoolId;
  const isRegistered = !!state.myRegistration;

  return `
    <h2>${round.name || 'Round ' + round.round_number} — Poolid</h2>
    <div class="card">
      ${myPoolId ? `<a href="/scorecard?pool=${myPoolId}" class="btn full">▶ Ava minu scorecard</a>` : ''}
      ${!isRegistered ? `<div class="empty-note" style="margin-bottom:10px;">Registreeru, et endale pool valida.</div>` : ''}
      <div style="margin-top:${myPoolId ? '14px' : '0'};">
        ${poolData.pools.map((p) => `
          <div class="pool-box ${p.id === myPoolId ? 'mine' : ''}">
            <div class="pool-head">
              <span class="pool-title">Pool ${p.pool_number}</span>
              <span class="pool-count">${p.players.length}${p.max_players ? '/' + p.max_players : ''} mängijat</span>
            </div>
            <div class="pool-members">${p.players.map((pl) => pl.first_name + ' ' + pl.last_name).join(', ') || 'Tühi'}</div>
            ${!isRegistered ? '' : p.id === myPoolId
              ? `<button class="btn secondary full" data-leave="${p.id}" data-round="${round.id}">Lahku sellest poolist</button>`
              : (myPoolId ? '' : (p.isFull ? `<div class="empty-note" style="margin-top:8px;">Täis</div>` : `<button class="btn full" data-join="${p.id}" data-round="${round.id}">Liitu selle pooliga</button>`))
            }
          </div>`).join('')}
      </div>
      <div class="error-msg" id="poolError-${round.id}"></div>
    </div>`;
}

async function joinPool(poolId, roundId) {
  const res = await fetch(`/api/pools/${poolId}/join`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
  const data = await res.json();
  if (!res.ok) { document.getElementById(`poolError-${roundId}`).textContent = data.error; return; }
  const pRes = await fetch(`/api/pools/round/${roundId}`, { headers: { Authorization: `Bearer ${token}` } });
  state.poolsByRound[roundId] = await pRes.json();
  render();
}
async function leavePool(poolId, roundId) {
  await fetch(`/api/pools/${poolId}/leave`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
  const pRes = await fetch(`/api/pools/round/${roundId}`, { headers: { Authorization: `Bearer ${token}` } });
  state.poolsByRound[roundId] = await pRes.json();
  render();
}

load();
</script>
</body>
</html>
