<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Võistlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #7EBAB5; --bg-panel: #ffffff; --bg-panel-2: #dceeec;
    --ink: #16302c; --ink-dim: #3f615c; --ink-faint: #6f8f8a;
    --line: rgba(22, 48, 44, 0.14); --accent: #ff6b35;
    --birdie: #2e9d5c; --bogey: #c97a1f; --double: #c94444;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-deep); color: var(--ink); font-family: var(--font-body); min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
  h2 { font-family: var(--font-display); font-size: 13px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 0 10px; }
  .back-link { color: var(--ink-faint); font-size: 12px; text-decoration: none; }
  .meta { color: var(--ink-dim); font-size: 13px; margin-bottom: 4px; }
  .status-pill { font-size: 10.5px; font-family: var(--font-display); font-weight: 700; padding: 4px 10px; border-radius: 100px; text-transform: uppercase; }
  .status-pill.registration_open { background: rgba(79,191,130,0.15); color: var(--birdie); }
  .status-pill.registered, .status-pill.live { background: rgba(255,107,53,0.15); color: var(--accent); }
  .status-pill.confirmed { background: rgba(79,191,130,0.25); color: var(--birdie); }
  .reg-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .reg-row:last-child { border-bottom: none; }
  .reg-row .mini-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-panel-2); color: var(--ink-dim);
    font-family: var(--font-display); font-weight: 600; font-size: 10.5px;
  }
  .reg-row .reg-name { flex: 1; }
  .division-group { border-radius: 12px; overflow: hidden; margin-bottom: 8px; background: var(--bg-panel-2); }
  .division-group:last-child { margin-bottom: 0; }
  .division-header { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; cursor: pointer; transition: background 0.15s; }
  .division-header:hover { background: rgba(255,107,53,0.06); }
  .division-header .label { font-family: var(--font-display); font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .division-header .count-chip { background: var(--bg-panel); color: var(--ink-faint); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; }
  .division-header .chevron { color: var(--ink-faint); font-size: 12px; transition: transform 0.2s ease; }
  .division-header .chevron.open { transform: rotate(180deg); }
  .division-body { display: none; padding: 0 14px 10px; background: var(--bg-panel); }
  .division-body .reg-row { padding-left: 0; }
  .empty-note { color: var(--ink-faint); font-size: 13px; }
  .btn { background: var(--accent); color: #1a0e08; border: none; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; padding: 9px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.secondary { background: var(--bg-panel-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.full { width: 100%; text-align: center; margin-top: 8px; }
  .pool-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .pool-box.mine { border-color: var(--accent); background: rgba(255,107,53,0.06); }
  .pool-head { display: flex; justify-content: space-between; align-items: center; }
  .pool-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
  .pool-count { font-size: 11.5px; color: var(--ink-faint); }
  .pool-members { font-size: 12.5px; color: var(--ink-dim); margin-top: 6px; }
  .error-msg { color: var(--double); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
<button id="playerThemeToggle" aria-label="Vaheta teemat" style="position:fixed; bottom:14px; right:14px; z-index:100; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-panel); color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.18);">🌙</button>
<div class="wrap" id="app"></div>
<script>
// ---------------------------------------------------------------------------
// Teema valik mängijatele: hele (RAL 6027, vaikimisi) või tume
// ---------------------------------------------------------------------------
const PLAYER_THEMES = {
  light: { '--bg-deep': '#7EBAB5', '--bg-panel': '#ffffff', '--bg-panel-2': '#dceeec', '--ink': '#16302c', '--ink-dim': '#3f615c', '--ink-faint': '#6f8f8a', '--line': 'rgba(22, 48, 44, 0.14)', '--birdie': '#2e9d5c', '--bogey': '#c97a1f', '--double': '#c94444' },
  dark: { '--bg-deep': '#0a1512', '--bg-panel': '#0f1e1a', '--bg-panel-2': '#142c25', '--ink': '#eaf2ee', '--ink-dim': '#7fa396', '--ink-faint': '#4d6a60', '--line': 'rgba(234, 242, 238, 0.09)', '--birdie': '#4fbf82', '--bogey': '#e8974a', '--double': '#d9534f' },
};
function applyPlayerTheme(name) {
  const theme = PLAYER_THEMES[name] || PLAYER_THEMES.light;
  Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  localStorage.setItem('dg_player_theme', name);
  const btn = document.getElementById('playerThemeToggle');
  if (btn) btn.textContent = name === 'dark' ? '☀️' : '🌙';
}
function togglePlayerTheme() {
  const current = localStorage.getItem('dg_player_theme') || 'light';
  applyPlayerTheme(current === 'dark' ? 'light' : 'dark');
}
document.getElementById('playerThemeToggle').onclick = togglePlayerTheme;
applyPlayerTheme(localStorage.getItem('dg_player_theme') || 'light');

const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const token = localStorage.getItem('dg_player_token');
const app = document.getElementById('app');
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}
const STATUS_LABELS_ET = {
  draft: 'Mustand', registration_open: 'Registreerimine avatud', registration_closed: 'Registreerimine suletud',
  live: 'Käimas', finished: 'Lõppenud', archived: 'Arhiveeritud',
};
let state = { event: null, divisions: [], rounds: [], registrations: [], myRegistration: null, poolsByRound: {} };

async function load(retriesLeft) {
  if (retriesLeft === undefined) retriesLeft = 2;
  app.innerHTML = `<div class="card">Laen...</div>`;
  const res = await fetch(`/api/events/${slug}`);
  if (!res.ok) {
    if (retriesLeft > 0) {
      // Kohe registreerimise/konto loomise järel suunatud lehed võivad
      // esimesel katsel mõne millisekundi vanuse serveri/võrgu tõttu
      // ebaõnnestuda - proovime lühikese viivitusega uuesti, enne kui
      // näitame "ei leitud" viga (see segadab mängijaid asjatult).
      await new Promise((r) => setTimeout(r, 500));
      return load(retriesLeft - 1);
    }
    app.innerHTML = `<div class="card">Võistlust ei leitud. <button class="btn small" onclick="load()">Proovi uuesti</button></div>`;
    return;
  }
  const data = await res.json();
  state.event = data.event; state.divisions = data.divisions; state.rounds = data.rounds; state.registrations = data.registrations;

  if (token) {
    const myRes = await fetch('/api/registrations', { headers: { Authorization: `Bearer ${token}` } });
    if (myRes.ok) {
      const myData = await myRes.json();
      state.myRegistration = myData.registrations.find((r) => r.event_id === state.event.id) || null;
    }
  }

  if (token) {
    for (const round of state.rounds) {
      const pRes = await fetch(`/api/pools/round/${round.id}`, { headers: { Authorization: `Bearer ${token}` } });
      if (pRes.ok) state.poolsByRound[round.id] = await pRes.json();
    }
  }

  render();
}

function groupByDivision(regs) {
  const map = {};
  for (const r of regs) {
    const key = r.division_name || 'Muu';
    if (!map[key]) map[key] = [];
    map[key].push(r);
  }
  return map;
}

function render() {
  const divGroups = groupByDivision(state.registrations);
  const divisionsHtml = Object.entries(divGroups).map(([divName, regs], idx) => `
    <div class="division-group">
      <div class="division-header" data-toggle-div="d${idx}">
        <span class="label">🏆 ${esc(divName)} <span class="count-chip">${regs.length}</span></span>
        <span class="chevron" id="chev-d${idx}">▾</span>
      </div>
      <div class="division-body" id="divBody-d${idx}">
        ${regs.map((r) => `<div class="reg-row"><div class="mini-avatar">${(r.first_name?.[0]||'')+(r.last_name?.[0]||'')}</div><span class="reg-name">${esc(r.first_name)} ${esc(r.last_name)}</span></div>`).join('')}
      </div>
    </div>`).join('');

  app.innerHTML = `
    <a class="back-link" href="/dashboard">← Minu konto</a>
    <h1>${esc(state.event.name)}</h1>
    <div class="meta">${state.event.location || ''} ${state.event.start_date ? '· ' + new Date(state.event.start_date).toLocaleDateString('et-EE') : ''}</div>
    <span class="status-pill ${state.event.status}">${STATUS_LABELS_ET[state.event.status] || state.event.status.replace('_',' ')}</span>

    ${!token ? `<div class="card" style="margin-top:16px;">Logi sisse, et registreeruda või pooli valida. <a href="/dashboard" class="btn small" style="margin-top:8px;">Mine kontole</a></div>` : ''}

    ${token && !state.myRegistration && state.event.status === 'registration_open'
      ? `<div class="card" style="margin-top:16px;">Sa pole veel registreerunud. <a href="/dashboard" class="btn full">Registreeru dashboardil</a></div>` : ''}

    ${token && state.myRegistration && !['live','finished','archived'].includes(state.event.status)
      ? `<div class="card" style="margin-top:16px;">
          <div style="font-size:13px; color:var(--ink-dim); margin-bottom:8px;">Staatus: ${state.myRegistration.paid_at ? 'Kinnitatud' : 'Registreeritud'}.</div>
          <button class="btn secondary full" id="withdrawBtn">Loobu võistlusest</button>
          <div class="error-msg" id="withdrawError"></div>
        </div>` : ''}

    <h2>Registreerunud mängijad (${state.registrations.length})</h2>
    <div class="card">
      ${state.registrations.length === 0 ? '<div class="empty-note">Registreerumisi pole veel.</div>' : divisionsHtml}
    </div>

    ${token ? state.rounds.map(renderRoundPools).join('') : ''}
  `;

  document.querySelectorAll('[data-toggle-div]').forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.toggleDiv;
      const body = document.getElementById(`divBody-${id}`);
      const chev = document.getElementById(`chev-${id}`);
      const isHidden = body.style.display !== 'block';
      body.style.display = isHidden ? 'block' : 'none';
      chev.classList.toggle('open', isHidden);
    };
  });
  document.querySelectorAll('[data-toggle-pools]').forEach((btn) => {
    btn.onclick = () => {
      const body = document.getElementById(`poolsBody-${btn.dataset.togglePools}`);
      const isHidden = body.style.display !== 'block';
      body.style.display = isHidden ? 'block' : 'none';
      btn.textContent = (isHidden ? 'Peida grupid ' : 'Näita gruppe ') + btn.dataset.count;
    };
  });
  document.querySelectorAll('[data-join]').forEach((btn) => btn.onclick = () => joinPool(btn.dataset.join, btn.dataset.round));
  document.querySelectorAll('[data-leave]').forEach((btn) => btn.onclick = () => leavePool(btn.dataset.leave, btn.dataset.round));
  const withdrawBtn = document.getElementById('withdrawBtn');
  if (withdrawBtn) withdrawBtn.onclick = withdrawFromEvent;
}

async function withdrawFromEvent() {
  const ok = confirm(`Kindel, et soovid loobuda võistlusest "${state.event.name}"?\n\nSinu registreerimine ja pooli-valik selle võistluse jaoks kustutatakse.`);
  if (!ok) return;
  const btn = document.getElementById('withdrawBtn');
  btn.disabled = true;
  btn.textContent = 'Loobun...';
  try {
    const res = await fetch(`/api/registrations/${state.myRegistration.id}`, {
      method: 'DELETE', headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('withdrawError').textContent = data.error;
      btn.disabled = false;
      btn.textContent = 'Loobu võistlusest';
      return;
    }
    window.location.href = '/dashboard';
  } catch (e) {
    document.getElementById('withdrawError').textContent = 'Ühendus ebaõnnestus.';
    btn.disabled = false;
    btn.textContent = 'Loobu võistlusest';
  }
}

function renderRoundPools(round) {
  const poolData = state.poolsByRound[round.id];
  if (!poolData || poolData.pools.length === 0) {
    return `<h2>${round.name || 'Round ' + round.round_number} — Poolid</h2><div class="card empty-note">Poole pole veel avatud.</div>`;
  }
  const myPoolId = poolData.myPoolId;
  const isRegistered = !!state.myRegistration;
  const totalPlayers = poolData.pools.reduce((sum, p) => sum + p.players.length, 0);
  const countLabel = `(${poolData.pools.length} pooli, ${totalPlayers} mängijat)`;

  return `
    <h2>${round.name || 'Round ' + round.round_number} — Poolid</h2>
    <div class="card">
      ${myPoolId ? `<a href="/scorecard?pool=${myPoolId}" class="btn full">▶ Ava minu scorecard</a>` : ''}
      ${!isRegistered ? `<div class="empty-note" style="margin-bottom:10px;">Registreeru, et endale pool valida.</div>` : ''}
      <button class="btn secondary full" data-toggle-pools="${round.id}" data-count="${countLabel}" style="margin-top:${myPoolId ? '10px' : '0'};">
        Näita gruppe ${countLabel}
      </button>
      <div id="poolsBody-${round.id}" style="display:none; margin-top:14px;">
        ${poolData.pools.map((p) => `
          <div class="pool-box ${p.id === myPoolId ? 'mine' : ''}">
            <div class="pool-head">
              <span class="pool-title">Pool ${p.pool_number}${p.locked ? ' 🔒' : ''}</span>
              <span class="pool-count">${p.players.length}${p.max_players ? '/' + p.max_players : ''} mängijat</span>
            </div>
            <div class="pool-members">${p.players.map((pl) => esc(pl.first_name) + ' ' + esc(pl.last_name)).join(', ') || 'Tühi'}</div>
            ${!isRegistered ? '' : p.id === myPoolId
              ? `<button class="btn secondary full" data-leave="${p.id}" data-round="${round.id}">Lahku sellest poolist</button>`
              : (myPoolId ? '' : (p.locked ? `<div class="empty-note" style="margin-top:8px;">🔒 Lukustatud</div>` : (p.isFull ? `<div class="empty-note" style="margin-top:8px;">Täis</div>` : `<button class="btn full" data-join="${p.id}" data-round="${round.id}">Liitu selle pooliga</button>`)))
            }
          </div>`).join('')}
      </div>
      <div class="error-msg" id="poolError-${round.id}"></div>
    </div>`;
}

async function joinPool(poolId, roundId) {
  const res = await fetch(`/api/pools/${poolId}/join`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
  const data = await res.json();
  if (!res.ok) { document.getElementById(`poolError-${roundId}`).textContent = data.error; return; }
  const pRes = await fetch(`/api/pools/round/${roundId}`, { headers: { Authorization: `Bearer ${token}` } });
  state.poolsByRound[roundId] = await pRes.json();
  render();
}
async function leavePool(poolId, roundId) {
  await fetch(`/api/pools/${poolId}/leave`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
  const pRes = await fetch(`/api/pools/round/${roundId}`, { headers: { Authorization: `Bearer ${token}` } });
  state.poolsByRound[roundId] = await pRes.json();
  render();
}

load();
</script>
</body>
</html>
