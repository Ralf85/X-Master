<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #7EBAB5;
    --bg-panel: #ffffff;
    --bg-panel-2: #dceeec;
    --ink: #16302c;
    --ink-dim: #3f615c;
    --ink-faint: #6f8f8a;
    --line: rgba(22, 48, 44, 0.14);
    --accent: #ff6b35;
    --birdie: #2e9d5c;
    --eagle: #f2c94c;
    --par-bg: #1c3a32;
    --bogey: #c97a1f;
    --double: #c94444;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg-deep);
    background-image: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,107,53,0.08), transparent);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 18px 16px 100px; }

  /* --- Login screen --- */
  .login-card {
    margin-top: 20vh;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 22px;
  }
  .login-card h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
  .login-card p { color: var(--ink-dim); font-size: 13.5px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 6px; margin-top: 14px; }
  input {
    width: 100%;
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 10px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary {
    width: 100%;
    margin-top: 20px;
    background: var(--accent);
    color: #1a0e08;
    border: none;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.98); }
  .error-msg { color: var(--double); font-size: 13px; margin-top: 12px; min-height: 16px; }

  /* --- Scorecard header --- */
  .sc-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sc-topbar .hole-label { font-family: var(--font-display); font-weight: 700; font-size: 26px; }
  .sc-topbar .park-name { font-size: 12px; color: var(--ink-dim); }
  .sc-topbar .par-pill {
    background: var(--par-bg); color: var(--ink);
    font-family: var(--font-display); font-weight: 600; font-size: 13px;
    padding: 6px 12px; border-radius: 100px;
  }

  .progress-dots { display: flex; gap: 5px; margin-bottom: 18px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.done { background: var(--birdie); }
  .dot.current { background: var(--accent); width: 18px; border-radius: 4px; }

  .player-card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .player-card .avatar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--bg-deep);
  }
  .player-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .player-sub { font-size: 12px; color: var(--ink-faint); }

  .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .score-btn {
    padding: 16px 6px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-panel-2);
    color: var(--ink);
    font-family: var(--font-display);
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    position: relative;
  }
  .score-btn .num { font-size: 22px; font-weight: 700; }
  .score-btn .lbl { font-size: 10px; letter-spacing: 0.04em; color: var(--ink-dim); }
  .score-btn:active { transform: scale(0.96); }
  .score-btn.selected { border: 2px solid var(--accent); background: rgba(255,107,53,0.12); }
  .score-btn.dnp {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    border-style: dashed;
    background: transparent;
  }
  .score-btn.dnp .num { font-size: 16px; }
  .score-btn.dnp .lbl { font-size: 11px; letter-spacing: 0.03em; }
  .score-btn.selected-conflict { border: 2px solid var(--double); background: rgba(217,83,79,0.14); }
  .selected-check { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--accent); }
  .score-btn.selected-conflict .selected-check { color: var(--double); }
  .score-btn.hio .num { color: var(--eagle); }
  .score-btn.eagle .num, .score-btn.albatross .num { color: var(--eagle); }
  .score-btn.birdie .num { color: var(--birdie); }
  .score-btn.bogey .num { color: var(--bogey); }
  .score-btn.double .num { color: var(--double); }
  .score-btn.more { background: var(--bg-panel); }

  .done-card {
    text-align: center;
    padding: 30px 18px;
    color: var(--ink-dim);
    font-family: var(--font-display);
  }
  .score-summary-list {
    text-align: left;
    max-width: 260px;
    margin: 18px auto;
    background: var(--bg-panel-2);
    border-radius: 12px;
    padding: 6px 16px;
  }
  .score-summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line);
    font-family: var(--font-body); font-size: 13.5px; color: var(--ink);
  }
  .score-summary-row:last-child { border-bottom: none; }
  .score-summary-row .strokes {
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
  }
  .joke-corner {
    max-width: 280px; margin: 4px auto 18px; padding: 12px 16px;
    background: rgba(255,107,53,0.08); border: 1px dashed rgba(255,107,53,0.35);
    border-radius: 12px; display: none; align-items: flex-start; gap: 10px; text-align: left;
  }
  .joke-corner:not(:empty) { display: flex; }
  .joke-icon { font-size: 18px; flex-shrink: 0; }
  .joke-text { font-family: var(--font-body); font-size: 12.5px; color: var(--ink-dim); line-height: 1.4; }

  .nav-row {
    display: flex; gap: 10px;
    position: fixed; bottom: 0; left: 0; right: 0;
    max-width: 480px; margin: 0 auto;
    background: var(--bg-deep);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    z-index: 10;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .nav-btn:disabled { opacity: 0.35; }
  .nav-btn.primary { background: var(--accent); color: #1a0e08; border: none; }
  .nav-btn-group { display: flex; gap: 8px; flex: 1; min-width: 0; }
  .nav-btn-group .nav-btn { flex: 1; padding: 14px 4px; font-size: 12px; min-width: 0; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 90px;
    max-width: 448px; margin: 0 auto;
    background: var(--double); color: #fff;
    padding: 13px 16px; border-radius: 10px;
    font-size: 13.5px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: none;
  }
  .toast.show { display: block; }
  .sync-note { text-align: center; font-size: 11px; color: var(--ink-faint); margin-top: 10px; }

  /* --- More-strokes picker --- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .modal-backdrop.show { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 480px;
    background: var(--bg-panel-2);
    border-radius: 18px 18px 0 0;
    padding: 22px;
    text-align: center;
  }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 18px 0; }
  .stepper button {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--bg-panel);
    color: var(--ink); font-size: 22px; cursor: pointer;
  }
  .stepper .val { font-family: var(--font-display); font-size: 32px; font-weight: 700; min-width: 50px; }
</style>
</head>
<body>
<button id="playerThemeToggle" aria-label="Vaheta teemat" style="position:fixed; bottom:14px; right:14px; z-index:100; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-panel); color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.18);">🌙</button>
<div class="wrap" id="app"></div>

<div class="modal-backdrop" id="moreModal">
  <div class="modal-sheet">
    <div style="color:var(--ink-dim); font-size:13px;">Sisesta täpne tulemus</div>
    <div class="stepper">
      <button id="moreMinus">−</button>
      <div class="val" id="moreVal">7</div>
      <button id="morePlus">+</button>
    </div>
    <button class="btn-primary" id="moreConfirm">Kinnita</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="announcementModal">
  <div class="modal-sheet" style="text-align:center;">
    <div style="font-size:38px; margin-bottom:10px;">📢</div>
    <div id="announcementText" style="font-size:16px; font-weight:600; line-height:1.4; margin-bottom:22px;"></div>
    <button class="nav-btn primary" id="announcementAck" style="width:100%; font-size:15px; padding:13px;">LOETUD</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Teema valik mängijatele: hele (RAL 6027, vaikimisi) või tume
// ---------------------------------------------------------------------------
const PLAYER_THEMES = {
  light: { '--bg-deep': '#7EBAB5', '--bg-panel': '#ffffff', '--bg-panel-2': '#dceeec', '--ink': '#16302c', '--ink-dim': '#3f615c', '--ink-faint': '#6f8f8a', '--line': 'rgba(22, 48, 44, 0.14)', '--birdie': '#2e9d5c', '--bogey': '#c97a1f', '--double': '#c94444' },
  dark: { '--bg-deep': '#0a1512', '--bg-panel': '#0f1e1a', '--bg-panel-2': '#142c25', '--ink': '#eaf2ee', '--ink-dim': '#7fa396', '--ink-faint': '#4d6a60', '--line': 'rgba(234, 242, 238, 0.09)', '--birdie': '#4fbf82', '--bogey': '#e8974a', '--double': '#d9534f' },
};
function applyPlayerTheme(name) {
  const theme = PLAYER_THEMES[name] || PLAYER_THEMES.light;
  Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  localStorage.setItem('dg_player_theme', name);
  const btn = document.getElementById('playerThemeToggle');
  if (btn) btn.textContent = name === 'dark' ? '☀️' : '🌙';
}
function togglePlayerTheme() {
  const current = localStorage.getItem('dg_player_theme') || 'light';
  applyPlayerTheme(current === 'dark' ? 'light' : 'dark');
}
document.getElementById('playerThemeToggle').onclick = togglePlayerTheme;
applyPlayerTheme(localStorage.getItem('dg_player_theme') || 'light');

const API = '';
const AVATAR_COLORS = ['#4fbf82', '#f2c94c', '#ff6b35', '#5b9bd5', '#c77dff', '#e8974a'];
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}
const FUN_AVATARS = ['🐶','🐱','🐰','🐻','🐼','🐨','🐷','🐸','🐵','🐧','🐦','🐝','🐢','🐬','🐙','🐴'];
function initials(f, l) { return ((f?.[0]||'') + (l?.[0]||'')).toUpperCase(); }
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function funAvatarFor(playerId) {
  return FUN_AVATARS[playerId % FUN_AVATARS.length];
}
function avatarHtml(player, sizeStyle) {
  const color = avatarColor((player.first_name || '') + (player.last_name || ''));
  if (player.profile_image_url) {
    return `<img src="${player.profile_image_url}" class="avatar" style="${sizeStyle} object-fit:cover;" alt="">`;
  }
  return `<div class="avatar" style="${sizeStyle} background:${color}; font-size:1.1em;">${funAvatarFor(player.player_id)}</div>`;
}

// Shotgun-start: pool ei pruugi alustada rajast 1. Mäng käib start_hole'ist
// kuni kursuse lõpuni, siis jätkub rajast 1 ja lõpeb rajal enne start_hole'i.
function getPlayOrder(holes, startHoleNumber) {
  const startIdx = holes.findIndex((h) => h.hole_number === startHoleNumber);
  if (startIdx <= 0) return holes;
  return [...holes.slice(startIdx), ...holes.slice(0, startIdx)];
}

function generateButtons(par) {
  const labels = { '-4': 'CONDOR', '-3': 'ALBATROSS', '-2': 'EAGLE', '-1': 'BIRDIE', '0': 'PAR', '1': 'BOGEY', '2': 'DOUBLE' };
  const seen = new Set();
  const buttons = [];
  for (let diff = -4; diff <= 2; diff++) {
    const strokes = par + diff;
    if (strokes < 1 || seen.has(strokes)) continue;
    seen.add(strokes);
    const label = strokes === 1 ? 'HIO' : labels[String(diff)];
    if (!label) continue;
    buttons.push({ strokes, label, cls: label.toLowerCase() });
  }
  buttons.sort((a, b) => a.strokes - b.strokes);
  buttons.push({ strokes: null, label: 'MORE', cls: 'more', isMore: true, moreStart: par + 3 });
  buttons.push({ strokes: null, label: 'RADA JÄI VAHELE', cls: 'dnp', isDnp: true });
  return buttons;
}

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 3200);
}

const params = new URLSearchParams(location.search);
const poolId = params.get('pool');

let state = {
  token: localStorage.getItem('dg_player_token'),
  pool: null, players: [], holes: [], scores: {},
  holeIdx: 0, playerIdx: 0,
};

function scoreKey(playerId, holeId) { return `${playerId}_${holeId}`; }

function renderLogin(errorMsg) {
  app.innerHTML = `
    <div class="login-card">
      <h1>Scorecard</h1>
      <p>Logi sisse, et tulemusi märkida.</p>
      <label for="pid">Player ID või email</label>
      <input id="pid" type="text" inputmode="email" placeholder="nt 18472 või sina@email.ee">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="••••">
      <button class="btn-primary" id="loginBtn">Logi sisse</button>
      <div class="error-msg">${errorMsg || ''}</div>
    </div>`;
  document.getElementById('loginBtn').onclick = doLogin;
}

async function doLogin() {
  const identifier = document.getElementById('pid').value.trim();
  const pin = document.getElementById('pin').value;
  try {
    const res = await fetch(`${API}/api/players/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier, pin }),
    });
    const data = await res.json();
    if (!res.ok) return renderLogin(data.error || 'Sisselogimine ebaõnnestus.');
    state.token = data.token;
    localStorage.setItem('dg_player_token', data.token);
    loadScorecard();
  } catch (e) {
    renderLogin('Ühendus ebaõnnestus.');
  }
}

// ---------------------------------------------------------------------------
// Kiirteated adminilt (nt "Ring peatatud äikese tõttu") - polli't taustal.
// ---------------------------------------------------------------------------
function announcementStorageKey() { return `dg_last_announcement_${state.pool?.event_id}`; }

async function checkAnnouncements() {
  if (!state.pool?.event_id) return;
  try {
    const res = await fetch(`${API}/api/announcements/${state.pool.event_id}/latest`);
    const data = await res.json();
    if (!data.announcement) return;
    const seenId = localStorage.getItem(announcementStorageKey());
    if (String(data.announcement.id) !== seenId) {
      document.getElementById('announcementText').textContent = data.announcement.message;
      const modal = document.getElementById('announcementModal');
      modal.dataset.currentId = data.announcement.id;
      modal.classList.add('show');
    }
  } catch (e) { /* ei ole kriitiline, proovime järgmisel korral uuesti */ }
}
document.getElementById('announcementAck').onclick = () => {
  const modal = document.getElementById('announcementModal');
  localStorage.setItem(announcementStorageKey(), modal.dataset.currentId);
  modal.classList.remove('show');
};

let announcementInterval = null;
function startAnnouncementPolling() {
  checkAnnouncements();
  if (announcementInterval) clearInterval(announcementInterval);
  announcementInterval = setInterval(checkAnnouncements, 15000);
}

async function loadScorecard() {
  if (!poolId) {
    app.innerHTML = `<div class="login-card"><h1>Puudub grupp</h1><p>Lingile peab olema lisatud ?pool=ID</p></div>`;
    return;
  }
  app.innerHTML = `<div class="done-card">Laen scorecardi...</div>`;
  try {
    const res = await fetch(`${API}/api/scorecard/${poolId}`, {
      headers: { Authorization: `Bearer ${state.token}` },
    });
    if (res.status === 401) { localStorage.removeItem('dg_player_token'); return renderLogin('Sessioon aegus, logi uuesti sisse.'); }
    const data = await res.json();
    if (!res.ok) { app.innerHTML = `<div class="done-card">${data.error}</div>`; return; }

    state.pool = data.pool;
    state.players = data.players;
    state.holes = data.holes;
    state.playOrder = getPlayOrder(data.holes, state.pool.start_hole);
    state.scores = {};
    for (const s of data.scores) state.scores[scoreKey(s.player_id, s.hole_id)] = s;

    if (state.playOrder.length === 0) {
      app.innerHTML = `<div class="done-card">Radu pole veel lisatud.<br><span style="font-size:12px">Korraldaja peab need enne lisama.</span></div>`;
      startAnnouncementPolling();
      return;
    }

    // Kui eelmisest korrast on veel salvestamata tulemusi kohapeal, näita neid kohe
    for (const item of getPendingQueue()) {
      state.scores[scoreKey(item.playerId, item.holeId)] = { hole_id: item.holeId, player_id: item.playerId, strokes: item.strokes, status: 'pending_sync' };
    }

    resumePosition();
    renderHole();
    flushQueue();
    startAnnouncementPolling();
  } catch (e) {
    app.innerHTML = `<div class="done-card">Ühendus ebaõnnestus. <br><button class="nav-btn" onclick="loadScorecard()">Proovi uuesti</button></div>`;
  }
}

function holeComplete(holeIdx) {
  const hole = state.playOrder[holeIdx];
  return state.players.every((p) => state.scores[scoreKey(p.player_id, hole.id)]);
}
function firstUnscoredPlayerIdx(holeIdx) {
  const hole = state.playOrder[holeIdx];
  const idx = state.players.findIndex((p) => !state.scores[scoreKey(p.player_id, hole.id)]);
  return idx === -1 ? state.players.length : idx;
}
function resumePosition() {
  let hIdx = state.playOrder.findIndex((_, i) => !holeComplete(i));
  if (hIdx === -1) hIdx = state.playOrder.length - 1;
  state.holeIdx = hIdx;
  state.playerIdx = firstUnscoredPlayerIdx(hIdx);
}

// ---------------------------------------------------------------------------
// OFFLINE-FIRST: kui võrku pole, salvestame kohapeal ja proovime hiljem uuesti.
// ---------------------------------------------------------------------------
const PENDING_KEY = 'dg_pending_scores_' + poolId;

function getPendingQueue() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { return []; }
}
function setPendingQueue(q) {
  localStorage.setItem(PENDING_KEY, JSON.stringify(q));
  updateSyncIndicator();
}
function queueScore(playerId, holeId, strokes, isDnp) {
  const q = getPendingQueue().filter((item) => !(item.playerId === playerId && item.holeId === holeId));
  q.push({ playerId, holeId, strokes, isDnp: !!isDnp, queuedAt: Date.now() });
  setPendingQueue(q);
}
function updateSyncIndicator() {
  const el = document.getElementById('syncNote');
  if (!el) return;
  const q = getPendingQueue();
  if (q.length === 0) {
    el.textContent = '✓ Kõik salvestatud serverisse';
    el.style.color = 'var(--ink-faint)';
  } else {
    el.textContent = `⚠ Offline — ${q.length} tulemust ootab saatmist`;
    el.style.color = 'var(--bogey)';
  }
}

let isSyncing = false;
async function flushQueue() {
  if (isSyncing || !state.token) return;
  const q = getPendingQueue();
  if (q.length === 0) return;
  isSyncing = true;
  const el = document.getElementById('syncNote');
  if (el) { el.textContent = '⟳ Sünkroniseerin...'; el.style.color = 'var(--accent)'; }

  const remaining = [];
  let syncedCount = 0;
  for (const item of q) {
    try {
      const res = await fetch(`${API}/api/scorecard/${poolId}/holes/${item.holeId}/players/${item.playerId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
        body: JSON.stringify(item.isDnp ? { dnp: true } : { strokes: item.strokes }),
      });
      const data = await res.json();
      if (res.status === 409) {
        showToast(`⚠ Sünkides konflikt — salvestatud: ${data.officialScore.strokes}. Anna korraldajale teada.`);
        state.scores[scoreKey(item.playerId, item.holeId)] = { hole_id: item.holeId, player_id: item.playerId, strokes: data.officialScore.strokes, status: 'conflict' };
        syncedCount++;
      } else if (res.ok) {
        state.scores[scoreKey(item.playerId, item.holeId)] = { hole_id: item.holeId, player_id: item.playerId, strokes: data.officialScore.strokes, status: data.officialScore.status };
        syncedCount++;
      } else {
        remaining.push(item);
      }
    } catch (e) {
      remaining.push(item); // ikka veel offline - proovime järgmisel korral
    }
  }
  setPendingQueue(remaining);
  isSyncing = false;
  if (syncedCount > 0 && remaining.length === 0) showToast(`✓ ${syncedCount} tulemust sünkroonitud.`);
  renderHole();
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 8000);

async function submitScore(playerId, holeId, strokes, isDnp) {
  try {
    const res = await fetch(`${API}/api/scorecard/${poolId}/holes/${holeId}/players/${playerId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
      body: JSON.stringify(isDnp ? { dnp: true } : { strokes }),
    });
    const data = await res.json();
    if (res.status === 409) {
      showToast(`⚠ Tulemus ei kattu — salvestatud: ${data.officialScore.strokes ?? '−'}. Anna korraldajale teada.`);
      state.scores[scoreKey(playerId, holeId)] = { hole_id: holeId, player_id: playerId, strokes: data.officialScore.strokes, status: 'conflict' };
      return false;
    }
    if (!res.ok) { showToast(data.error || 'Viga salvestamisel.'); return false; }
    state.scores[scoreKey(playerId, holeId)] = { hole_id: holeId, player_id: playerId, strokes: data.officialScore.strokes, status: data.officialScore.status };
    return true;
  } catch (networkErr) {
    // Võrku ei saadud - salvesta kohapeal, mängija saab jätkata
    queueScore(playerId, holeId, strokes, isDnp);
    state.scores[scoreKey(playerId, holeId)] = { hole_id: holeId, player_id: playerId, strokes: isDnp ? null : strokes, status: isDnp ? 'dnp' : 'pending_sync' };
    return true;
  }
}

function isRoundFullyComplete() {
  for (const h of state.playOrder) {
    for (const p of state.players) {
      if (!state.scores[scoreKey(p.player_id, h.id)]) return false;
    }
  }
  return true;
}

function renderHole() {
  const hole = state.playOrder[state.holeIdx];
  const complete = state.playerIdx >= state.players.length;
  const isLastHoleInOrder = state.holeIdx === state.playOrder.length - 1;
  const roundFinished = complete && isLastHoleInOrder && isRoundFullyComplete();

  let dots = state.players.map((p, i) => {
    const has = state.scores[scoreKey(p.player_id, hole.id)];
    const cls = i === state.playerIdx && !complete ? 'current' : has ? 'done' : '';
    return `<div class="dot ${cls}"></div>`;
  }).join('');

  let body;
  if (roundFinished) {
    body = `<div class="done-card">🏁 Ring on läbitud!<br><span style="font-size:12px">Kõik tulemused on salvestatud.</span></div>`;
  } else if (complete) {
    const summaryRows = state.players.map((p) => {
      const s = state.scores[scoreKey(p.player_id, hole.id)];
      const strokesColor = !s ? 'var(--ink-faint)' : s.status === 'conflict' ? 'var(--double)' : 'var(--ink)';
      const strokesDisplay = !s ? '–' : (s.status === 'dnp' ? '−' : s.strokes);
      return `<div class="score-summary-row"><span>${esc(p.first_name)}</span><span class="strokes" style="color:${strokesColor};">${strokesDisplay}</span></div>`;
    }).join('');
    body = `<div class="done-card">
      ✓ Kõik tulemused sisestatud
      <div class="score-summary-list">${summaryRows}</div>
      <div class="joke-corner" id="jokeCorner"></div>
      <span style="font-size:12px">Vajuta "Järgmine rada"</span>
    </div>`;
  } else {
    const player = state.players[state.playerIdx];
    const buttons = generateButtons(hole.par);
    const existingScore = state.scores[scoreKey(player.player_id, hole.id)];
    body = `
      <div class="player-card">
        <div class="avatar-row">
          ${avatarHtml(player, '')}
          <div>
            <div class="player-name">${esc(player.first_name)} ${esc(player.last_name)}</div>
            <div class="player-sub">#${player.player_number}</div>
          </div>
        </div>
        ${existingScore ? `<div style="font-size:11px; color:var(--ink-faint); margin-bottom:8px;">Eelnevalt märgitud: <strong style="color:${existingScore.status === 'conflict' ? 'var(--double)' : 'var(--accent)'};">${existingScore.status === 'dnp' ? 'Rada jäi vahele' : existingScore.strokes}</strong></div>` : ''}
        <div class="btn-grid">
          ${buttons.map((b) => {
            let isSelected = false;
            if (existingScore) {
              if (b.isDnp) isSelected = existingScore.status === 'dnp';
              else if (b.isMore) isSelected = existingScore.status !== 'dnp' && existingScore.strokes >= b.moreStart;
              else isSelected = existingScore.status !== 'dnp' && existingScore.strokes === b.strokes;
            }
            const selClass = isSelected ? (existingScore.status === 'conflict' ? 'selected-conflict' : 'selected') : '';
            const numDisplay = b.isDnp ? '−' : (b.isMore ? b.moreStart + '+' : b.strokes);
            return `
            <button class="score-btn ${b.cls} ${selClass}" data-strokes="${b.strokes || ''}" data-more="${b.isMore ? '1' : ''}" data-more-start="${b.moreStart || ''}" data-dnp="${b.isDnp ? '1' : ''}">
              ${isSelected ? '<span class="selected-check">✓</span>' : ''}
              <span class="num">${numDisplay}</span>
              <span class="lbl">${b.label}</span>
            </button>
          `;
          }).join('')}
        </div>
      </div>`;
  }

  app.innerHTML = `
    <div class="sc-topbar">
      <div>
        <div class="hole-label">Rada ${hole.hole_number}</div>
        <div class="park-name">${esc(hole.park_name || '')}</div>
      </div>
      <div style="text-align:right;">
        <div class="par-pill">PAR ${hole.par}</div>
        <a href="/leaderboard?round=${state.pool.round_id}" style="display:block; margin-top:6px; font-size:11px; color:var(--ink-faint); text-decoration:underline;">🏆 Tulemused</a>
      </div>
    </div>
    <div class="progress-dots">${dots}</div>
    ${body}
    <div class="nav-row">
      <div class="nav-btn-group">
        <button class="nav-btn" id="backBtn">← Tagasi</button>
        <button class="nav-btn" id="prevHoleBtn" ${state.holeIdx === 0 ? 'disabled' : ''}>◀ Eelmine rada</button>
      </div>
      ${roundFinished
        ? `<a class="nav-btn primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" href="/leaderboard?round=${state.pool.round_id}">Vaata leaderboard'i</a>`
        : `<button class="nav-btn primary" id="nextHoleBtn">Järgmine rada →</button>`}
    </div>
    <div class="sync-note" id="syncNote">✓ Kõik salvestatud serverisse</div>
  `;

  document.getElementById('backBtn').onclick = goBack;
  const prevHoleBtn = document.getElementById('prevHoleBtn');
  if (prevHoleBtn) prevHoleBtn.onclick = goPreviousHole;
  const nextBtn = document.getElementById('nextHoleBtn');
  if (nextBtn) nextBtn.onclick = goNextHole;
  document.querySelectorAll('.score-btn').forEach((btn) => {
    btn.onclick = () => {
      if (btn.dataset.more) openMoreModal();
      else if (btn.dataset.dnp) handleScore(null, true);
      else {
        speakScore(Number(btn.dataset.strokes));
        handleScore(Number(btn.dataset.strokes));
      }
    };
  });
  updateSyncIndicator();
  if (complete && !roundFinished) loadJokeCorner();
}

// ---------------------------------------------------------------------------
// Naljanurk raja lõpus - juhuslik anekdoodi-mall, kohatäitjad {P1},{P2}...
// asendatakse selle pooli päris mängijate eesnimedega.
// ---------------------------------------------------------------------------
const JOKE_FILLER_NAMES = ['Sakslane', 'Juhuslik Külaline', 'Tundmatu Sõber', 'Mööduja Peeter'];
async function loadJokeCorner() {
  const el = document.getElementById('jokeCorner');
  if (!el) return;
  try {
    const hole = state.playOrder[state.holeIdx];
    const res = await fetch(`${API}/api/jokes/random?eventId=${state.pool.event_id}&holeNumber=${hole.hole_number}`);
    const data = await res.json();
    if (!data.joke) return;
    let text = data.joke.template_text;
    state.players.forEach((p, i) => {
      text = text.split(`{P${i + 1}}`).join(p.first_name);
    });
    // Kui mall vajab rohkem mängijaid kui poolis päriselt on, täidetakse
    // ülejäänud kohatäitjad naljaka täitenimega (mitte tühjaks - see lõhub lause).
    // Sama numbriga kohatäitja saab kogu teksti ulatuses SAMA nime.
    const fillerAssignments = {};
    text = text.replace(/\{P(\d+)\}/g, (match, num) => {
      if (!fillerAssignments[num]) {
        fillerAssignments[num] = JOKE_FILLER_NAMES[Math.floor(Math.random() * JOKE_FILLER_NAMES.length)];
      }
      return fillerAssignments[num];
    });
    el.innerHTML = `<div class="joke-icon">😄</div><div class="joke-text">${esc(text)}</div>`;
  } catch (e) { /* pole kriitiline, jäta lihtsalt näitamata */ }
}

// ---------------------------------------------------------------------------
// Tulemuse häälega kinnitamine - päris salvestatud helifailid (mitte
// brauseri kõnesüntees, mis ei oska väljamõeldud sõnu hästi hääldada).
// Aitab vältida pettust, kus märkija ütleb valjult teistsuguse tulemuse
// kui tegelikult sisestab.
// ---------------------------------------------------------------------------
const SCORE_VOICE_FILES = {
  1: '/sounds/1-holar.mp3',
  2: '/sounds/2-birdie.mp3',
  3: '/sounds/3-par.mp3',
  4: '/sounds/4-bougy.mp3',
  5: '/sounds/5-tupla.mp3',
  '6+': '/sounds/6-oeh.mp3',
};
const scoreVoiceAudio = {};
function preloadScoreVoices() {
  Object.entries(SCORE_VOICE_FILES).forEach(([key, url]) => {
    const audio = new Audio(url);
    audio.preload = 'auto';
    scoreVoiceAudio[key] = audio;
  });
}
preloadScoreVoices();
function speakScore(strokes) {
  try {
    const key = strokes >= 6 ? '6+' : strokes;
    const audio = scoreVoiceAudio[key];
    if (!audio) return;
    audio.currentTime = 0;
    audio.play().catch(() => { /* brauser blokeeris - ignoreeri vaikselt */ });
  } catch (e) { /* heli pole saadaval, ignoreeri */ }
}

async function handleScore(strokes, isDnp) {
  const hole = state.playOrder[state.holeIdx];
  const player = state.players[state.playerIdx];
  const ok = await submitScore(player.player_id, hole.id, strokes, isDnp);
  if (state.playerIdx < state.players.length) state.playerIdx += 1;
  renderHole();
}

function goBack() {
  if (state.playerIdx > 0) {
    state.playerIdx -= 1;
  } else if (state.holeIdx > 0) {
    state.holeIdx -= 1;
    state.playerIdx = Math.max(0, state.players.length - 1);
  }
  renderHole();
}
function goNextHole() {
  if (state.holeIdx < state.playOrder.length - 1) {
    state.holeIdx += 1;
    state.playerIdx = firstUnscoredPlayerIdx(state.holeIdx);
    renderHole();
  }
}
function goPreviousHole() {
  if (state.holeIdx > 0) {
    state.holeIdx -= 1;
    state.playerIdx = firstUnscoredPlayerIdx(state.holeIdx);
    renderHole();
  }
}

const moreModal = document.getElementById('moreModal');
const moreValEl = document.getElementById('moreVal');
let moreVal = 7;
function openMoreModal() {
  const hole = state.playOrder[state.holeIdx];
  moreVal = hole.par + 3;
  moreValEl.textContent = moreVal;
  moreModal.classList.add('show');
}
document.getElementById('moreMinus').onclick = () => { if (moreVal > 1) moreVal--; moreValEl.textContent = moreVal; };
document.getElementById('morePlus').onclick = () => { moreVal++; moreValEl.textContent = moreVal; };
document.getElementById('moreConfirm').onclick = () => { moreModal.classList.remove('show'); speakScore(moreVal); handleScore(moreVal); };

if (state.token) loadScorecard(); else renderLogin();
</script>
