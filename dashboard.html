<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minu konto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #7EBAB5; --bg-panel: #ffffff; --bg-panel-2: #dceeec;
    --ink: #16302c; --ink-dim: #3f615c; --ink-faint: #6f8f8a;
    --line: rgba(22, 48, 44, 0.14); --accent: #ff6b35;
    --birdie: #2e9d5c; --bogey: #c97a1f; --double: #c94444;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg-deep);
    background-image: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,107,53,0.08), transparent);
    color: var(--ink); font-family: var(--font-body); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }

  .card {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(22,48,44,0.04), 0 4px 16px rgba(22,48,44,0.06);
  }
  .card.primary {
    position: relative; padding-left: 28px; border-color: rgba(255,107,53,0.3);
    box-shadow: 0 1px 2px rgba(255,107,53,0.08), 0 8px 24px rgba(255,107,53,0.10);
  }
  .card.primary::before {
    content: ''; position: absolute; left: 0; top: 16px; bottom: 16px;
    width: 4px; background: var(--accent); border-radius: 0 3px 3px 0;
  }
  h1 { font-family: var(--font-display); font-size: 27px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  h2 {
    font-family: var(--font-display); font-size: 12.5px; font-weight: 700; color: var(--ink-faint);
    letter-spacing: 0.07em; text-transform: uppercase; margin: 30px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  h2::before { content: ''; width: 4px; height: 15px; background: var(--accent); border-radius: 1px; display: inline-block; transform: skewX(-12deg); }
  p.sub { color: var(--ink-dim); font-size: 13.5px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 6px; margin-top: 14px; }
  input, select {
    width: 100%; background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--font-body); font-size: 16px; padding: 12px 14px; border-radius: 10px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn {
    background: var(--accent); color: #1a0e08; border: none; font-family: var(--font-display);
    font-weight: 700; font-size: 14px; padding: 12px 18px; border-radius: 10px; cursor: pointer;
  }
  .btn:active { transform: scale(0.98); }
  .btn.secondary { background: var(--bg-panel-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.full { width: 100%; margin-top: 18px; }
  .btn.small { padding: 8px 14px; font-size: 12.5px; }
  .error-msg { color: var(--double); font-size: 13px; margin-top: 10px; min-height: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab { flex: 1; text-align: center; padding: 9px; border-radius: 8px; cursor: pointer; color: var(--ink-dim); font-family: var(--font-display); font-size: 13px; font-weight: 600; }
  .tab.active { background: var(--bg-panel-2); color: var(--ink); }

  .event-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .event-row:last-child { border-bottom: none; }
  .event-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
  .event-meta { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .badge { font-size: 10.5px; font-family: var(--font-display); font-weight: 700; padding: 4px 10px; border-radius: 5px; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.registered { background: rgba(79,191,130,0.15); color: var(--birdie); }
  .badge.confirmed { background: rgba(79,191,130,0.25); color: var(--birdie); }
  .badge.unpaid { background: rgba(217,83,79,0.15); color: var(--double); }
  .badge.open { background: rgba(255,107,53,0.15); color: var(--accent); }
  .badge.registration_open { background: rgba(79,191,130,0.15); color: var(--birdie); }
  .badge.live { background: rgba(255,107,53,0.15); color: var(--accent); }
  .badge.registration_closed { background: rgba(255,107,53,0.1); color: var(--ink-dim); }
  .badge.finished, .badge.archived { background: rgba(234,242,238,0.08); color: var(--ink-faint); }
  .empty-note { color: var(--ink-faint); font-size: 13px; padding: 8px 0; }
  .empty-state { text-align: center; padding: 26px 10px; color: var(--ink-faint); }
  .empty-state .icon { font-size: 30px; margin-bottom: 8px; opacity: 0.55; }
  .empty-state .text { font-size: 13px; }

  .top-user { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-user .who { font-size: 13px; color: var(--ink-dim); }
  .logout-link { color: var(--ink-faint); font-size: 12px; cursor: pointer; text-decoration: underline; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal-backdrop.show { display: flex; }
  .modal-sheet { width: 100%; max-width: 420px; background: var(--bg-panel-2); border-radius: 16px; padding: 22px; }
  .modal-sheet h3 { font-family: var(--font-display); margin: 0 0 4px; }
</style>
</head>
<body>
<button id="playerThemeToggle" aria-label="Vaheta teemat" style="position:fixed; bottom:14px; right:14px; z-index:100; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-panel); color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.18);">🌙</button>
<div class="wrap" id="app"></div>

<div class="modal-backdrop" id="regModal">
  <div class="modal-sheet">
    <h3 id="regEventName"></h3>
    <div id="regDivisionInfo" style="font-size:13px; color:var(--ink-dim); margin-top:4px;"></div>
    <div class="error-msg" id="regError"></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn secondary full" id="regCancel">Loobu</button>
      <button class="btn full" id="regConfirm">Kinnita registreerimine</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="guideModal">
  <div class="modal-sheet">
    <h3>📋 Juhend</h3>
    <div id="guideModalText" style="font-size:14px; color:var(--ink-dim); margin-top:8px; white-space:pre-line; max-height:50vh; overflow-y:auto;"></div>
    <div id="guideModalFileWrap" style="margin-top:12px;"></div>
    <button class="btn secondary full" id="guideModalClose" style="margin-top:16px;">Sulge</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Teema valik mängijatele: hele (RAL 6027, vaikimisi) või tume
// ---------------------------------------------------------------------------
const PLAYER_THEMES = {
  light: { '--bg-deep': '#7EBAB5', '--bg-panel': '#ffffff', '--bg-panel-2': '#dceeec', '--ink': '#16302c', '--ink-dim': '#3f615c', '--ink-faint': '#6f8f8a', '--line': 'rgba(22, 48, 44, 0.14)', '--birdie': '#2e9d5c', '--bogey': '#c97a1f', '--double': '#c94444' },
  dark: { '--bg-deep': '#0a1512', '--bg-panel': '#0f1e1a', '--bg-panel-2': '#142c25', '--ink': '#eaf2ee', '--ink-dim': '#7fa396', '--ink-faint': '#4d6a60', '--line': 'rgba(234, 242, 238, 0.09)', '--birdie': '#4fbf82', '--bogey': '#e8974a', '--double': '#d9534f' },
};
function applyPlayerTheme(name) {
  const theme = PLAYER_THEMES[name] || PLAYER_THEMES.light;
  Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  localStorage.setItem('dg_player_theme', name);
  const btn = document.getElementById('playerThemeToggle');
  if (btn) btn.textContent = name === 'dark' ? '☀️' : '🌙';
}
function togglePlayerTheme() {
  const current = localStorage.getItem('dg_player_theme') || 'light';
  applyPlayerTheme(current === 'dark' ? 'light' : 'dark');
}
document.getElementById('playerThemeToggle').onclick = togglePlayerTheme;
applyPlayerTheme(localStorage.getItem('dg_player_theme') || 'light');

const AVATAR_COLORS = ['#4fbf82', '#f2c94c', '#ff6b35', '#5b9bd5', '#c77dff', '#e8974a'];
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}
function emptyState(icon, text) {
  return `<div class="empty-state"><div class="icon">${icon}</div><div class="text">${esc(text)}</div></div>`;
}
function avatarColor(name) { let h=0; for (const c of name) h=(h*31+c.charCodeAt(0))%AVATAR_COLORS.length; return AVATAR_COLORS[Math.abs(h)]; }
function fmtDate(d) { return new Date(d).toLocaleDateString('et-EE', { day: 'numeric', month: 'short', year: 'numeric' }); }

const app = document.getElementById('app');
let state = { token: localStorage.getItem('dg_player_token'), player: null, registrations: [], events: [] };
let profileEditOpen = false;
const urlParams = new URLSearchParams(location.search);
const joinEventSlug = urlParams.get('event');
let joinAutoOpened = false;

function renderAuth(mode, errorMsg) {
  mode = mode || 'login';
  const joinBanner = joinEventSlug
    ? `<div style="background:rgba(255,107,53,0.1); border:1px solid rgba(255,107,53,0.35); border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:12.5px; color:var(--ink-dim);">
        🏆 Liitud võistlusega${joinEventName ? `: <strong style="color:var(--ink)">${joinEventName}</strong>` : '...'}. Tee konto (või logi sisse) ja suuname su kohe registreerimise juurde.
       </div>`

function renderForgotPin() {
  app.innerHTML = `
    <div class="card">
      <h1>Unustasin PIN-i</h1>
      <p class="sub">Sisesta oma Player ID või email - saadame taastekoodi sinu emailile.</p>

      <input id="forgotIdentifier" type="text" inputmode="email" placeholder="nt 18472 või sina@email.ee">
      <button class="btn full" id="sendForgotBtn" style="margin-top:14px;">Saada taastekood</button>
      <div class="ok-msg" id="forgotStatus" style="color:var(--birdie); font-size:13px; margin-top:10px;"></div>
      <div class="error-msg" id="forgotError"></div>
      <div style="text-align:center; margin-top:14px;"><span id="backToLoginLink" style="color:var(--ink-faint); font-size:12.5px; cursor:pointer; text-decoration:underline;">← Tagasi sisselogimisse</span></div>
    </div>`;
  document.getElementById('backToLoginLink').onclick = () => renderAuth('login');
  document.getElementById('sendForgotBtn').onclick = async () => {
    const identifier = document.getElementById('forgotIdentifier').value.trim();
    const statusEl = document.getElementById('forgotStatus');
    const errEl = document.getElementById('forgotError');
    errEl.textContent = ''; statusEl.textContent = '';
    if (!identifier) { errEl.textContent = 'Player ID või email on kohustuslik.'; return; }
    try {
      const res = await fetch('/api/players/forgot-pin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error; return; }
      statusEl.textContent = data.message;
      setTimeout(() => renderResetPin(identifier), 1500);
    } catch (e) { errEl.textContent = 'Ühendus ebaõnnestus.'; }
  };

function renderResetPin(identifier) {
  app.innerHTML = `

async function doLogin() {
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const identifier = document.getElementById('pid').value.trim();
  const pin = document.getElementById('pin').value;
  try {
    const res = await fetch('/api/players/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier, pin }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; return; }
    state.token = data.token;
    localStorage.setItem('dg_player_token', data.token);
    loadDashboard();
  } catch (e) { errEl.textContent = 'Ühendus ebaõnnestus.'; }
}

async function doRegister() {
  const errEl = document.getElementById('registerError');
  errEl.textContent = '';
  const email = document.getElementById('regEmail').value.trim();
  if (!email) { errEl.textContent = 'Email on kohustuslik.'; return; }
  const birthDate = document.getElementById('regBirthDate').value;
  const gender = document.getElementById('regGender').value;
  if (!birthDate) { errEl.textContent = 'Sünniaeg on kohustuslik.'; return; }
  if (!gender) { errEl.textContent = 'Sugu on kohustuslik.'; return; }
  const body = {
    firstName: document.getElementById('firstName').value,
    lastName: document.getElementById('lastName').value,
    pin: document.getElementById('newPin').value,
    pinConfirm: document.getElementById('newPinConfirm').value,
    email,
    phone: document.getElementById('regPhone').value || undefined,
    birthDate,
    gender,
  };
  try {
    const res = await fetch('/api/players/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; return; }
    state.token = data.token;
    localStorage.setItem('dg_player_token', data.token);
    loadDashboard();
  } catch (e) { errEl.textContent = 'Ühendus ebaõnnestus.'; }
}

async function uploadAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('image', file);
  document.getElementById('avatarError').textContent = '';
  try {
    const res = await fetch('/api/players/me/profile-image', {
      method: 'POST', headers: { Authorization: `Bearer ${state.token}` }, body: formData,
    });
    const data = await res.json();
    if (!res.ok) { document.getElementById('avatarError').textContent = data.error; return; }
    state.player = data.player;
    renderDashboard();
  } catch (err) { document.getElementById('avatarError').textContent = 'Üleslaadimine ebaõnnestus.'; }
}

async function removeAvatar() {
  const res = await fetch('/api/players/me/profile-image', { method: 'DELETE', headers: { Authorization: `Bearer ${state.token}` } });
  const data = await res.json();
  state.player = data.player;
  renderDashboard();
}

async function saveName() {
  const firstName = document.getElementById('editFirstName').value.trim();
  const lastName = document.getElementById('editLastName').value.trim();
  document.getElementById('nameError').textContent = '';
  document.getElementById('nameOk').textContent = '';
  if (!firstName || !lastName) {
    document.getElementById('nameError').textContent = 'Eesnimi ja perekonnanimi ei tohi olla tühjad.';
    return;
  }
  try {
    const res = await fetch('/api/players/me', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
      body: JSON.stringify({ firstName, lastName }),
    });
    const data = await res.json();
    if (!res.ok) { document.getElementById('nameError').textContent = data.error; return; }
    state.player = data.player;
    document.getElementById('nameOk').textContent = '✓ Salvestatud';
    document.querySelector('.top-user .who strong').textContent = state.player.first_name;
  } catch (e) {
    document.getElementById('nameError').textContent = 'Ühendus ebaõnnestus.';
  }
}

async function saveGender() {
  const birthDate = document.getElementById('editBirthDate').value;
  const gender = document.getElementById('editGender').value;
  document.getElementById('genderError').textContent = '';
  document.getElementById('genderOk').textContent = '';
  if (!birthDate) { document.getElementById('genderError').textContent = 'Sünniaeg on kohustuslik.'; return; }
  if (!gender) { document.getElementById('genderError').textContent = 'Sugu on kohustuslik.'; return; }
  try {
    const res = await fetch('/api/players/me', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
      body: JSON.stringify({ birthDate, gender }),
    });
    const data = await res.json();
    if (!res.ok) { document.getElementById('genderError').textContent = data.error; return; }
    state.player = data.player;
    document.getElementById('genderOk').textContent = '✓ Salvestatud';
    renderDashboard();
  } catch (e) {
    document.getElementById('genderError').textContent = 'Ühendus ebaõnnestus.';
  }
}

function logout() {
  localStorage.removeItem('dg_player_token');
  state = { token: null, player: null, registrations: [], events: [] };
  renderAuth('login');
}

// ---------------------------------------------------------------------------
// Registreerimislingi (/dashboard?event=slug) automaatne käsitlus:
// kui tuldi konkreetse võistluse liitumislingilt, tõmmatakse nimi ette
// ja peale sisselogimist/konto loomist avatakse kohe selle event'i
// registreerimise hüpikaken (või suunatakse otse edasi, kui juba liitunud).
// ---------------------------------------------------------------------------
let joinEventName = null;
if (joinEventSlug) {
  fetch(`/api/events/${joinEventSlug}`).then((r) => r.ok ? r.json() : null).then((d) => {
    if (!d) return;
    joinEventName = d.event.name;
    if (!state.token) renderAuth('register');
  }).catch(() => {});
}

function maybeAutoOpenJoinEvent() {
  if (!joinEventSlug || joinAutoOpened) return;
  const alreadyRegistered = state.registrations.some((r) => r.slug === joinEventSlug);
  if (alreadyRegistered) {
    joinAutoOpened = true;
    location.href = `/event?slug=${joinEventSlug}`;
    return;
  }
  const event = state.events.find((e) => e.slug === joinEventSlug);
  if (!event) return;
  if (event.status === 'registration_open') {
    joinAutoOpened = true;
    openRegisterModal(event.id, event.name);
  }
}

async function loadDashboard() {
  app.innerHTML = `<div class="card">Laen...</div>`;
  try {
    const [meRes, regRes, eventsRes] = await Promise.all([
      fetch('/api/players/me', { headers: { Authorization: `Bearer ${state.token}` } }),
      fetch('/api/registrations', { headers: { Authorization: `Bearer ${state.token}` } }),
      fetch('/api/events'),
    ]);
    if (meRes.status === 401) return logout();
    state.player = (await meRes.json()).player;
    state.registrations = (await regRes.json()).registrations;
    state.events = (await eventsRes.json()).events;
    renderDashboard();
  } catch (e) {
    app.innerHTML = `<div class="card">Ühendus ebaõnnestus. <button class="btn small" onclick="loadDashboard()">Proovi uuesti</button></div>`;
  }
}

function rowPast(r) {

const STATUS_LABELS_ET = {
  draft: 'Mustand',
  registration_open: 'Registreerimine avatud',
  registration_closed: 'Registreerimine suletud',
  live: 'Käimas',
  finished: 'Lõppenud',
  archived: 'Arhiveeritud',
};

function rowBrowse(e, registeredEventIds) {
  const canRegister = e.status === 'registration_open' && registeredEventIds && !registeredEventIds.has(e.id);
  return `<a href="/event?slug=${e.slug}" class="event-row" style="text-decoration:none; color:inherit; align-items:center;">
    <div><div class="event-name">${esc(e.name)}</div><div class="event-meta">${fmtDate(e.start_date)}${e.location ? ' · ' + e.location : ''}</div></div>
    ${canRegister
      ? `<button class="btn small" data-register="${e.id}" data-name="${esc(e.name)}">Registreeru</button>`
      : `<span class="badge ${e.status}">${STATUS_LABELS_ET[e.status] || e.status.replace('_',' ')}</span>`}
  </a>`;
}

const regModal = document.getElementById('regModal');
let regEventId = null;
async function openRegisterModal(eventId, eventName) {
  regEventId = eventId;
  document.getElementById('regEventName').textContent = eventName;
  document.getElementById('regError').textContent = '';

  const genderLabel = state.player.gender === 'M' ? 'Mehed' : state.player.gender === 'N' ? 'Naised' : null;
  document.getElementById('regDivisionInfo').textContent = genderLabel
    ? `Registreerud divisjoni: ${genderLabel}`
    : 'Sinu profiilil pole sugu määratud, seega ei saa divisjoni automaatselt valida. Täienda profiili ja proovi uuesti.';

  regModal.classList.add('show');
}
document.getElementById('regCancel').onclick = () => regModal.classList.remove('show');
document.getElementById('guideModalClose').onclick = () => document.getElementById('guideModal').classList.remove('show');
document.getElementById('regConfirm').onclick = async () => {
  try {
    const res = await fetch(`/api/registrations/${regEventId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
      body: JSON.stringify({}),
    });
    const data = await res.json();
    if (!res.ok) {
      // Kui oled sellel võistlusel juba registreeritud (nt eelmine katse
      // tegelikult õnnestus, aga lehekülg ei jõudnud seda näidata), ära
      // blokeeri mängijat tõrjuva veaga - liigu lihtsalt edasi.
      if (res.status === 409) {
        regModal.classList.remove('show');
        if (joinEventSlug) { location.href = `/event?slug=${joinEventSlug}`; return; }
        loadDashboard();
        return;
      }
      // Kui event'i ID pole enam kehtiv (nt korraldaja kustutas/lõi
      // võistluse uuesti, ja mängija leht oli vahepeal vana andmetega
      // laetud) - värskenda taustal nimekiri ja anna selge suund edasi,
      // selle asemel et jätta tupikseisu.
      if (res.status === 404) {
        regModal.classList.remove('show');
        document.getElementById('regError').textContent = '';
        await loadDashboard();
        alert('Selle võistluse info oli aegunud (nt korraldaja tegi hiljuti muudatuse). Nimekiri on nüüd värskendatud - palun proovi registreerumist uuesti.');
        return;
      }
      document.getElementById('regError').textContent = data.error;
      return;
    }
    regModal.classList.remove('show');
    if (joinEventSlug) { location.href = `/event?slug=${joinEventSlug}`; return; }
    loadDashboard();
  } catch (e) { document.getElementById('regError').textContent = 'Ühendus ebaõnnestus.'; }
};

if (state.token) loadDashboard(); else renderAuth(joinEventSlug ? 'register' : 'login');
</script>
</body>
</html>
