<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #7EBAB5;
    --bg-panel: #ffffff;
    --bg-panel-2: #dceeec;
    --bg-cell: #0d1f1a;
    --ink: #16302c;
    --ink-dim: #3f615c;
    --ink-faint: #6f8f8a;
    --line: rgba(22, 48, 44, 0.14);
    --accent: #ff6b35;
    --birdie: #2e9d5c;
    --birdie-ink: #0a1512;
    --eagle: #f2c94c;
    --par-bg: #1c3a32;
    --bogey: #c97a1f;
    --double: #c94444;
    --double-dark: #a13a37;
    --blue: #5b9bd5;
    --double-ink: #fff;
    --pending: #16302a;

    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-deep);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,107,53,0.08), transparent),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79,191,130,0.06), transparent);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 20px 16px;
    flex-wrap: wrap;
  }

  .back-link { color: var(--ink-faint); font-size: 12px; text-decoration: none; display: inline-block; margin-bottom: 10px; cursor: pointer; }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,107,53,0.12);
    border: 1px solid rgba(255,107,53,0.4);
    color: var(--accent);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.14em;
    padding: 5px 11px 5px 9px;
    border-radius: 100px;
    margin-bottom: 10px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,107,53,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(255,107,53,0); }
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(22px, 4vw, 32px);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--ink-dim); font-size: 14px; margin-top: 4px; }

  .meta {
    text-align: right;
    color: var(--ink-faint);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .state-message {
    margin: 60px 24px;
    text-align: center;
    color: var(--ink-dim);
    font-family: var(--font-display);
    font-size: 17px;
  }

  .board-wrapper {
    margin: 0 12px 32px;
    border-radius: 14px;
    border: 1px solid var(--line);
    overflow: auto;
    max-height: 78vh;
    background: var(--bg-panel);
    position: relative;
  }

  table.board {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
  }

  /* --- Header: park band row --- */
  .park-th {
    position: sticky;
    top: 0;
    z-index: 3;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: var(--ink);
    padding: 10px 14px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid rgba(0,0,0,0.25);
  }

  /* --- Header: hole number / par row --- */
  .hole-th {
    position: sticky;
    top: 37px;
    z-index: 3;
    background: var(--bg-panel-2);
    padding: 5px 2px 6px;
    text-align: center;
    min-width: 34px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid rgba(0,0,0,0.15);
  }
  .hole-th .num {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
  }
  .hole-th .par {
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* --- Sticky corner + player column --- */
  .corner-th {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 5;
    background: var(--bg-panel-2);
    min-width: 190px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  .player-td {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 7px 10px;
    min-width: 150px;
  }
  tr:nth-child(even) .player-td { background: var(--bg-panel-2); }
  tr:nth-child(even) .score-td { background: rgba(22,48,44,0.03); }

  .player-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rank {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-faint);
    width: 16px;
    text-align: right;
    flex-shrink: 0;
  }
  .rank.leader { color: var(--accent); font-size: 16px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 10px;
    color: var(--bg-deep);
    flex-shrink: 0;
  }
  .name-block { min-width: 0; flex: 1; }
  .firstname {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lastname-row {
    font-size: 10.5px;
    color: var(--ink-dim);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .division { font-size: 10.5px; color: var(--ink-faint); }
  .totals {
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .rel-score {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
  }
  .rel-score.under { color: var(--birdie); }
  .rel-score.over { color: var(--bogey); }
  .thru { font-size: 10px; color: var(--ink-faint); }

  /* --- Score cells --- */
  .score-td {
    text-align: center;
    padding: 5px 2px;
    border-right: 1px solid rgba(0,0,0,0.15);
    border-bottom: 1px solid var(--line);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .badge.pending { color: var(--ink-faint); font-weight: 400; }
  .badge.dnp { color: var(--ink-dim); font-weight: 700; border: 1.5px dashed var(--ink-faint); border-radius: 7px; }
  .badge.stroke1 {
    border-radius: 50%;
    background: var(--eagle);
    color: var(--bg-deep);
  }
  .badge.stroke2 {
    border-radius: 50%;
    background: var(--birdie);
    color: var(--birdie-ink);
  }
  .badge.stroke3 {
    border-radius: 7px;
    background: #fff;
    color: #16302c;
    border: 1px solid rgba(22,48,44,0.25);
  }
  .badge.stroke4 {
    border-radius: 7px;
    background: var(--double);
    color: var(--double-ink);
  }
  .badge.stroke5plus {
    border-radius: 7px;
    background: var(--double-dark);
    color: #fff;
  }
  .badge.conflict {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .board-wrapper::-webkit-scrollbar { height: 10px; width: 10px; }
  .board-wrapper::-webkit-scrollbar-track { background: transparent; }
  .board-wrapper::-webkit-scrollbar-thumb { background: #1c3a32; border-radius: 10px; }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    padding: 0 20px 24px;
    color: var(--ink-faint);
    font-size: 11.5px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal-sheet { width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto; background: var(--bg-panel-2); border-radius: 16px; padding: 20px; }
  .park-rank-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .park-rank-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<button id="playerThemeToggle" aria-label="Vaheta teemat" style="position:fixed; bottom:14px; right:14px; z-index:100; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-panel); color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.18);">🌙</button>
<div style="position:fixed; bottom:14px; left:14px; z-index:100; display:flex; align-items:center; gap:2px; background:var(--bg-panel); border:1px solid var(--line); border-radius:100px; box-shadow:0 2px 8px rgba(0,0,0,0.18); padding:4px;">
  <button id="zoomOutBtn" aria-label="Vähenda" style="width:30px; height:30px; border-radius:50%; border:none; background:transparent; color:var(--ink); font-size:16px; font-weight:700; cursor:pointer;">−</button>
  <span id="zoomLabel" style="font-family:var(--font-display); font-size:11px; font-weight:600; color:var(--ink-faint); min-width:34px; text-align:center;">100%</span>
  <button id="zoomInBtn" aria-label="Suurenda" style="width:30px; height:30px; border-radius:50%; border:none; background:transparent; color:var(--ink); font-size:16px; font-weight:700; cursor:pointer;">+</button>
</div>

<div class="topbar">
  <div>
    <a class="back-link" id="backLink">← Tagasi</a>
    <div class="live-pill"><span class="live-dot"></span>LIVE</div>
    <h1 id="eventTitle">Laen...</h1>
    <div class="subtitle" id="roundSubtitle"></div>
  </div>
  <div class="meta" id="lastUpdated"></div>
</div>

<div style="display:flex; gap:8px; padding:0 20px 14px;">
  <div class="view-tab active" id="tabLeaderboard" style="cursor:pointer; padding:7px 14px; border-radius:8px; background:var(--bg-panel-2); font-family:var(--font-display); font-size:12.5px; font-weight:600;">Leaderboard</div>
  <div class="view-tab" id="tabPools" style="cursor:pointer; padding:7px 14px; border-radius:8px; color:var(--ink-faint); font-family:var(--font-display); font-size:12.5px; font-weight:600;">Poolid</div>
</div>

<div id="content"></div>

<div class="modal-backdrop" id="parkModal">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 id="parkModalTitle" style="font-family:var(--font-display); margin:0;"></h3>
      <span id="parkModalClose" style="cursor:pointer; color:var(--ink-faint); font-size:20px;">✕</span>
    </div>
    <div id="parkModalBody"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Teema valik mängijatele: hele (RAL 6027, vaikimisi) või tume
// ---------------------------------------------------------------------------
const PLAYER_THEMES = {
  light: { '--bg-deep': '#7EBAB5', '--bg-panel': '#ffffff', '--bg-panel-2': '#dceeec', '--ink': '#16302c', '--ink-dim': '#3f615c', '--ink-faint': '#6f8f8a', '--line': 'rgba(22, 48, 44, 0.14)', '--birdie': '#2e9d5c', '--bogey': '#c97a1f', '--double': '#c94444' },
  dark: { '--bg-deep': '#0a1512', '--bg-panel': '#0f1e1a', '--bg-panel-2': '#142c25', '--ink': '#eaf2ee', '--ink-dim': '#7fa396', '--ink-faint': '#4d6a60', '--line': 'rgba(234, 242, 238, 0.09)', '--birdie': '#4fbf82', '--bogey': '#e8974a', '--double': '#d9534f' },
};
function applyPlayerTheme(name) {
  const theme = PLAYER_THEMES[name] || PLAYER_THEMES.light;
  Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  localStorage.setItem('dg_player_theme', name);
  const btn = document.getElementById('playerThemeToggle');
  if (btn) btn.textContent = name === 'dark' ? '☀️' : '🌙';
}
function togglePlayerTheme() {
  const current = localStorage.getItem('dg_player_theme') || 'light';
  applyPlayerTheme(current === 'dark' ? 'light' : 'dark');
}
document.getElementById('playerThemeToggle').onclick = togglePlayerTheme;
applyPlayerTheme(localStorage.getItem('dg_player_theme') || 'light');

// ---------------------------------------------------------------------------
// Leaderboardi zoom (suurenda/vähenda) - vaikimisi 100%, muudatus jääb
// meelde (localStorage) ja rakendub uuesti ka pärast andmete värskendust.
// ---------------------------------------------------------------------------
let boardZoom = parseFloat(localStorage.getItem('dg_board_zoom')) || 1;
function applyBoardZoom() {
  document.querySelectorAll('.board-wrapper').forEach((el) => { el.style.zoom = boardZoom; });
  const label = document.getElementById('zoomLabel');
  if (label) label.textContent = Math.round(boardZoom * 100) + '%';
  localStorage.setItem('dg_board_zoom', boardZoom);
}
document.getElementById('zoomOutBtn').onclick = () => {
  boardZoom = Math.max(0.6, Math.round((boardZoom - 0.1) * 10) / 10);
  applyBoardZoom();
};
document.getElementById('zoomInBtn').onclick = () => {
  boardZoom = Math.min(1.3, Math.round((boardZoom + 0.1) * 10) / 10);
  applyBoardZoom();
};

const params = new URLSearchParams(location.search);
const AVATAR_COLORS = ['#4fbf82', '#f2c94c', '#ff6b35', '#5b9bd5', '#c77dff', '#e8974a'];
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}
const FUN_AVATARS = ['🐶','🐱','🐰','🐻','🐼','🐨','🐷','🐸','🐵','🐧','🐦','🐝','🐢','🐬','🐙','🐴'];

function initials(first, last) {
  return ((first?.[0] || '') + (last?.[0] || '')).toUpperCase();
}
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function funAvatarFor(playerId) {
  return FUN_AVATARS[playerId % FUN_AVATARS.length];
}
function scoreBadge(strokes, par, status) {
  const conflictClass = status === 'conflict' ? ' conflict' : '';
  if (status === 'dnp') {
    return `<span class="badge dnp${conflictClass}">–</span>`;
  }
  if (strokes === null || strokes === undefined) {
    return `<span class="badge pending">–</span>`;
  }
  let cls;
  if (strokes === 1) cls = 'stroke1';
  else if (strokes === 2) cls = 'stroke2';
  else if (strokes === 3) cls = 'stroke3';
  else if (strokes === 4) cls = 'stroke4';
  else cls = 'stroke5plus';
  return `<span class="badge ${cls}${conflictClass}">${strokes}</span>`;
}
function groupParks(holes) {
  const groups = [];
  for (const h of holes) {
    const last = groups[groups.length - 1];
    if (last && last.park_id === h.park_id) last.count++;
    else groups.push({ park_id: h.park_id, name: h.park_name || 'Rajad', count: 1 });
  }
  return groups;
}
function fmtRelative(n) {
  if (n === null) return '–';
  if (n === 0) return 'E';
  return n > 0 ? `+${n}` : `${n}`;
}

function groupByDivision(leaderboard) {
  const groups = [];
  for (const p of leaderboard) {
    const last = groups[groups.length - 1];
    if (last && last.divisionName === p.divisionName) last.players.push(p);
    else groups.push({ divisionName: p.divisionName, players: [p] });
  }
  return groups;
}

function render(data) {
  document.getElementById('eventTitle').textContent = data.round.event_name;
  document.getElementById('roundSubtitle').textContent =
    (data.round.round_name || `Round ${data.round.round_number}`) + ' · Par ' + data.totalPar;

  if (data.leaderboard.length === 0) {
    document.getElementById('content').innerHTML =
      `<div class="state-message">Tulemusi pole veel sisestatud. Vaade uueneb automaatselt.</div>`;
    return;
  }

  const parkGroups = groupParks(data.holes);

  let parkRow = `<th class="corner-th"></th>`;
  for (const g of parkGroups) {
    parkRow += `<th class="park-th" colspan="${g.count}" data-park-id="${g.park_id}" data-park-name="${esc(g.name)}" style="cursor:${g.park_id ? 'pointer' : 'default'};">${esc(g.name)}${g.park_id ? ' 🔍' : ''}</th>`;
  }

  let holeRow = `<th class="corner-th" style="top:37px;"></th>`;
  for (const h of data.holes) {
    holeRow += `<th class="hole-th"><div class="num">${h.hole_number}</div><div class="par">Par ${h.par}</div></th>`;
  }

  const divisionGroups = groupByDivision(data.leaderboard);
  let allTablesHtml = '';

  divisionGroups.forEach((group) => {
    let body = '';
    group.players.forEach((p, i) => {
      const color = avatarColor(p.firstName + p.lastName);
      const avatarHtml = p.profileImageUrl
        ? `<img src="${p.profileImageUrl}" class="avatar" style="object-fit:cover;" alt="">`
        : `<div class="avatar" style="background:${color}; font-size:15px;">${funAvatarFor(p.playerId)}</div>`;
      const relClass = p.relativeToPar < 0 ? 'under' : p.relativeToPar > 0 ? 'over' : '';
      body += `<tr>
        <td class="player-td">
          <div class="player-row">
            <div class="rank ${p.thru > 0 && i === 0 ? 'leader' : ''}">${p.thru > 0 ? i + 1 : '–'}</div>
            ${avatarHtml}
            <div class="name-block">
              <div class="firstname">${esc(p.firstName)}</div>
              <div class="lastname-row">${esc(p.lastName)}</div>
            </div>
            <div class="totals">
              <div class="rel-score ${relClass}">${fmtRelative(p.relativeToPar)}</div>
              <div class="thru">THRU ${p.thru}</div>
            </div>
          </div>
        </td>`;
      for (const h of p.holeScores) {
        body += `<td class="score-td">${scoreBadge(h.strokes, h.par, h.status)}</td>`;
      }
      body += `</tr>`;
    });

    allTablesHtml += `
      <h2 style="font-family:var(--font-display); font-size:15px; padding:0 20px; margin:22px 0 10px;">${group.divisionName}</h2>
      <div class="board-wrapper">
        <table class="board">
          <thead>
            <tr>${parkRow}</tr>
            <tr>${holeRow}</tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>`;
  });

  document.getElementById('content').innerHTML = `
    ${allTablesHtml}
    <div class="legend">
      <span><i style="background:var(--eagle); border-radius:50%;"></i> 1</span>
      <span><i style="background:var(--birdie); border-radius:50%;"></i> 2</span>
      <span><i style="background:#fff; border:1px solid var(--line);"></i> 3</span>
      <span><i style="background:var(--double);"></i> 4</span>
      <span><i style="background:var(--double-dark);"></i> 5+</span>
    </div>
  `;
  applyBoardZoom();
}

const eventSlug = params.get('event');
const roundId = params.get('round');
const apiUrl = eventSlug ? `/api/leaderboard/event/${eventSlug}` : `/api/leaderboard/round/${roundId || '1'}`;

let currentRoundId = null;

async function load() {
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) {
      document.getElementById('content').innerHTML =
        `<div class="state-message">Võistlust/ringi ei leitud.</div>`;
      return;
    }
    const data = await res.json();
    currentRoundId = data.round.id;
    const backLink = document.getElementById('backLink');
    if (backLink && !backLink.dataset.wired) {
      backLink.dataset.wired = '1';
      if (data.round.slug) {
        backLink.href = `/event?slug=${data.round.slug}`;
      } else {
        backLink.href = 'javascript:void(0)';
        backLink.onclick = () => history.back();
      }
    }
    render(data);
    wireParkClicks();
    document.getElementById('lastUpdated').textContent =
      'Uuendatud ' + new Date().toLocaleTimeString('et-EE');
  } catch (err) {
    document.getElementById('content').innerHTML =
      `<div class="state-message">Ühendus katkes. Proovime uuesti...</div>`;
  }
}

function wireParkClicks() {
  document.querySelectorAll('[data-park-id]').forEach((th) => {
    if (!th.dataset.parkId || th.dataset.parkId === 'null') return;
    th.onclick = () => openParkModal(th.dataset.parkId, th.dataset.parkName);
  });
}

async function openParkModal(parkId, parkName) {
  const modal = document.getElementById('parkModal');
  document.getElementById('parkModalTitle').textContent = parkName + ' - ranking';
  document.getElementById('parkModalBody').innerHTML = 'Laen...';
  modal.classList.add('show');

  try {
    const res = await fetch(`/api/leaderboard/round/${currentRoundId}/park/${parkId}`);
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('parkModalBody').innerHTML = `<div class="state-message" style="margin:20px 0;">${data.error}</div>`;
      return;
    }
    if (data.ranking.length === 0) {
      document.getElementById('parkModalBody').innerHTML = `<div style="color:var(--ink-faint); font-size:13px;">Keegi pole seda parki veel läbinud.</div>`;
      return;
    }
    document.getElementById('parkModalBody').innerHTML = `
      <div style="color:var(--ink-faint); font-size:11.5px; margin-bottom:10px;">Par ${data.park.par} · ${data.park.holeCount} rada</div>
      ${data.ranking.map((r, i) => {
        const color = avatarColor(r.firstName + r.lastName);
        const avatarHtml = r.profileImageUrl
          ? `<img src="${r.profileImageUrl}" class="avatar" style="object-fit:cover;" alt="">`
          : `<div class="avatar" style="background:${color}; font-size:15px;">${funAvatarFor(r.playerId)}</div>`;
        return `
        <div class="park-rank-row" style="align-items:center;">
          <span style="display:flex; align-items:center; gap:10px;">
            <span style="width:16px; text-align:right; flex-shrink:0; color:var(--ink-faint); font-family:var(--font-display); font-weight:700; font-size:13px;">${i + 1}.</span>
            ${avatarHtml}
            <span>${esc(r.firstName)} ${esc(r.lastName)}</span>
          </span>
          <span style="font-family:var(--font-display); font-weight:700; color:${r.relativeToPar < 0 ? 'var(--birdie)' : r.relativeToPar > 0 ? 'var(--bogey)' : 'var(--ink)'};">${r.relativeToPar === 0 ? 'E' : r.relativeToPar > 0 ? '+' + r.relativeToPar : r.relativeToPar}</span>
        </div>`;
      }).join('')}
    `;
  } catch (e) {
    document.getElementById('parkModalBody').innerHTML = `<div class="state-message" style="margin:20px 0;">Ühendus ebaõnnestus.</div>`;
  }
}
document.getElementById('parkModalClose').onclick = () => document.getElementById('parkModal').classList.remove('show');
document.getElementById('parkModal').onclick = (e) => { if (e.target.id === 'parkModal') e.currentTarget.classList.remove('show'); };

// ---------------------------------------------------------------------------
// POOLID vaade (punkt 1/4/54) - avalik, kes kus mängib
// ---------------------------------------------------------------------------
let activeView = 'leaderboard';

function renderPoolsView(poolsData) {
  const el = document.getElementById('content');
  if (poolsData.pools.length === 0) {
    el.innerHTML = `<div class="state-message">Poole pole veel loodud.</div>`;
    return;
  }
  el.innerHTML = `
    <div style="padding:0 20px 24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;">
      ${poolsData.pools.map((p) => `
        <div style="background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:14px;">
          <div style="font-family:var(--font-display); font-weight:600; margin-bottom:8px;">Pool ${p.pool_number}${p.start_time ? ' · ' + p.start_time : ''}</div>
          <div style="font-size:12.5px; color:var(--ink-dim);">
            ${p.players.map((pl) => `<div style="padding:3px 0;">${esc(pl.first_name)} ${esc(pl.last_name)}</div>`).join('') || '<span style="color:var(--ink-faint);">Tühi</span>'}
          </div>
        </div>`).join('')}
    </div>
  `;
}

async function loadPools() {
  if (!currentRoundId) return;
  document.getElementById('content').innerHTML = `<div class="state-message">Laen...</div>`;
  try {
    const res = await fetch(`/api/leaderboard/round/${currentRoundId}/pools`);
    const data = await res.json();
    renderPoolsView(data);
    document.getElementById('lastUpdated').textContent = 'Uuendatud ' + new Date().toLocaleTimeString('et-EE');
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="state-message">Ühendus katkes.</div>`;
  }
}

function switchView(view) {
  activeView = view;
  const lb = document.getElementById('tabLeaderboard');
  const pl = document.getElementById('tabPools');
  lb.style.background = view === 'leaderboard' ? 'var(--bg-panel-2)' : 'transparent';
  lb.style.color = view === 'leaderboard' ? 'var(--ink)' : 'var(--ink-faint)';
  pl.style.background = view === 'pools' ? 'var(--bg-panel-2)' : 'transparent';
  pl.style.color = view === 'pools' ? 'var(--ink)' : 'var(--ink-faint)';
  if (view === 'pools') loadPools(); else load();
}
document.getElementById('tabLeaderboard').onclick = () => switchView('leaderboard');
document.getElementById('tabPools').onclick = () => switchView('pools');

load();
setInterval(() => { if (activeView === 'leaderboard') load(); else loadPools(); }, 8000);
</script>
</body>
</html>
