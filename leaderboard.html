<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a1512;
    --bg-panel: #0f1e1a;
    --bg-panel-2: #142c25;
    --bg-cell: #0d1f1a;
    --ink: #eaf2ee;
    --ink-dim: #7fa396;
    --ink-faint: #4d6a60;
    --line: rgba(234, 242, 238, 0.09);
    --accent: #ff6b35;
    --birdie: #4fbf82;
    --birdie-ink: #0a1512;
    --eagle: #f2c94c;
    --par-bg: #1c3a32;
    --bogey: #e8974a;
    --double: #d9534f;
    --double-ink: #fff;
    --pending: #16302a;

    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-deep);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,107,53,0.08), transparent),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79,191,130,0.06), transparent);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 20px 16px;
    flex-wrap: wrap;
  }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,107,53,0.12);
    border: 1px solid rgba(255,107,53,0.4);
    color: var(--accent);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.14em;
    padding: 5px 11px 5px 9px;
    border-radius: 100px;
    margin-bottom: 10px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,107,53,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(255,107,53,0); }
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(22px, 4vw, 32px);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--ink-dim); font-size: 14px; margin-top: 4px; }

  .meta {
    text-align: right;
    color: var(--ink-faint);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .state-message {
    margin: 60px 24px;
    text-align: center;
    color: var(--ink-dim);
    font-family: var(--font-display);
    font-size: 17px;
  }

  .board-wrapper {
    margin: 0 12px 32px;
    border-radius: 14px;
    border: 1px solid var(--line);
    overflow: auto;
    max-height: 78vh;
    background: var(--bg-panel);
    position: relative;
  }

  table.board {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
  }

  /* --- Header: park band row --- */
  .park-th {
    position: sticky;
    top: 0;
    z-index: 3;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: var(--ink);
    padding: 10px 14px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid rgba(0,0,0,0.25);
  }

  /* --- Header: hole number / par row --- */
  .hole-th {
    position: sticky;
    top: 37px;
    z-index: 3;
    background: var(--bg-panel-2);
    padding: 7px 4px 9px;
    text-align: center;
    min-width: 46px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid rgba(0,0,0,0.15);
  }
  .hole-th .num {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
  }
  .hole-th .par {
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* --- Sticky corner + player column --- */
  .corner-th {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 5;
    background: var(--bg-panel-2);
    min-width: 230px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  .player-td {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 9px 14px;
    min-width: 230px;
  }
  tr:nth-child(even) .player-td { background: #0d1c18; }
  tr:nth-child(even) .score-td { background: rgba(255,255,255,0.012); }

  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rank {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-faint);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 11px;
    color: var(--bg-deep);
    flex-shrink: 0;
  }
  .name-block { min-width: 0; flex: 1; }
  .name {
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .division { font-size: 10.5px; color: var(--ink-faint); }
  .totals {
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .rel-score {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
  }
  .rel-score.under { color: var(--birdie); }
  .rel-score.over { color: var(--bogey); }
  .thru { font-size: 10px; color: var(--ink-faint); }

  /* --- Score cells --- */
  .score-td {
    text-align: center;
    padding: 6px 4px;
    border-right: 1px solid rgba(0,0,0,0.15);
    border-bottom: 1px solid var(--line);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .badge.pending { color: var(--ink-faint); font-weight: 400; }
  .badge.par {
    border-radius: 7px;
    background: var(--par-bg);
    color: var(--ink);
  }
  .badge.birdie {
    border-radius: 50%;
    background: var(--birdie);
    color: var(--birdie-ink);
  }
  .badge.eagle {
    border-radius: 50%;
    background: var(--eagle);
    color: var(--bg-deep);
    box-shadow: 0 0 0 2px rgba(242,201,76,0.35);
  }
  .badge.ace {
    clip-path: polygon(50% 6%, 94% 94%, 6% 94%);
    background: var(--eagle);
    color: var(--bg-deep);
    width: 26px; height: 26px;
  }
  .badge.bogey {
    border-radius: 7px;
    background: var(--bogey);
    color: var(--bg-deep);
  }
  .badge.double {
    border-radius: 7px;
    background: var(--double);
    color: var(--double-ink);
  }
  .badge.conflict {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .board-wrapper::-webkit-scrollbar { height: 10px; width: 10px; }
  .board-wrapper::-webkit-scrollbar-track { background: transparent; }
  .board-wrapper::-webkit-scrollbar-thumb { background: #1c3a32; border-radius: 10px; }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    padding: 0 20px 24px;
    color: var(--ink-faint);
    font-size: 11.5px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="live-pill"><span class="live-dot"></span>LIVE</div>
    <h1 id="eventTitle">Laen...</h1>
    <div class="subtitle" id="roundSubtitle"></div>
  </div>
  <div class="meta" id="lastUpdated"></div>
</div>

<div id="content"></div>

<script>
const params = new URLSearchParams(location.search);
const AVATAR_COLORS = ['#4fbf82', '#f2c94c', '#ff6b35', '#5b9bd5', '#c77dff', '#e8974a'];
const FUN_AVATARS = ['🦉','🐶','🦊','🐸','🦁','🐼','🐨','🦄','🐙','🦋','🐢','🦩','🐝','🐧','🦔','☀️','🌙','⚡','🌵','🍄'];

function initials(first, last) {
  return ((first?.[0] || '') + (last?.[0] || '')).toUpperCase();
}
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function funAvatarFor(playerId) {
  return FUN_AVATARS[playerId % FUN_AVATARS.length];
}
function scoreBadge(strokes, par, status) {
  const conflictClass = status === 'conflict' ? ' conflict' : '';
  if (strokes === null || strokes === undefined) {
    return `<span class="badge pending">–</span>`;
  }
  if (strokes === 1) {
    return `<span class="badge ace${conflictClass}">${strokes}</span>`;
  }
  const diff = strokes - par;
  let cls = 'par';
  if (diff <= -2) cls = 'eagle';
  else if (diff === -1) cls = 'birdie';
  else if (diff === 1) cls = 'bogey';
  else if (diff >= 2) cls = 'double';
  return `<span class="badge ${cls}${conflictClass}">${strokes}</span>`;
}
function groupParks(holes) {
  const groups = [];
  for (const h of holes) {
    const last = groups[groups.length - 1];
    if (last && last.park_id === h.park_id) last.count++;
    else groups.push({ park_id: h.park_id, name: h.park_name || 'Rajad', count: 1 });
  }
  return groups;
}
function fmtRelative(n) {
  if (n === null) return '–';
  if (n === 0) return 'E';
  return n > 0 ? `+${n}` : `${n}`;
}

function render(data) {
  document.getElementById('eventTitle').textContent = data.round.event_name;
  document.getElementById('roundSubtitle').textContent =
    (data.round.round_name || `Round ${data.round.round_number}`) + ' · Par ' + data.totalPar;

  if (data.leaderboard.length === 0) {
    document.getElementById('content').innerHTML =
      `<div class="state-message">Tulemusi pole veel sisestatud. Vaade uueneb automaatselt.</div>`;
    return;
  }

  const parkGroups = groupParks(data.holes);

  let parkRow = `<th class="corner-th"></th>`;
  for (const g of parkGroups) {
    parkRow += `<th class="park-th" colspan="${g.count}">${g.name}</th>`;
  }

  let holeRow = `<th class="corner-th" style="top:37px;"></th>`;
  for (const h of data.holes) {
    holeRow += `<th class="hole-th"><div class="num">${h.hole_number}</div><div class="par">Par ${h.par}</div></th>`;
  }

  let body = '';
  data.leaderboard.forEach((p, i) => {
    const color = avatarColor(p.firstName + p.lastName);
    const avatarHtml = p.profileImageUrl
      ? `<img src="${p.profileImageUrl}" class="avatar" style="object-fit:cover;" alt="">`
      : `<div class="avatar" style="background:${color}; font-size:15px;">${funAvatarFor(p.playerId)}</div>`;
    const relClass = p.relativeToPar < 0 ? 'under' : p.relativeToPar > 0 ? 'over' : '';
    body += `<tr>
      <td class="player-td">
        <div class="player-row">
          <div class="rank">${p.thru > 0 ? i + 1 : '–'}</div>
          ${avatarHtml}
          <div class="name-block">
            <div class="name">${p.firstName} ${p.lastName}</div>
            <div class="division">${p.divisionName}</div>
          </div>
          <div class="totals">
            <div class="rel-score ${relClass}">${fmtRelative(p.relativeToPar)}</div>
            <div class="thru">THRU ${p.thru}</div>
          </div>
        </div>
      </td>`;
    for (const h of p.holeScores) {
      body += `<td class="score-td">${scoreBadge(h.strokes, h.par, h.status)}</td>`;
    }
    body += `</tr>`;
  });

  document.getElementById('content').innerHTML = `
    <div class="board-wrapper">
      <table class="board">
        <thead>
          <tr>${parkRow}</tr>
          <tr>${holeRow}</tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="legend">
      <span><i style="background:var(--eagle)"></i> Ace / Eagle</span>
      <span><i style="background:var(--birdie)"></i> Birdie</span>
      <span><i style="background:var(--par-bg)"></i> Par</span>
      <span><i style="background:var(--bogey)"></i> Bogey</span>
      <span><i style="background:var(--double)"></i> Double bogey+</span>
    </div>
  `;
}

const eventSlug = params.get('event');
const roundId = params.get('round');
const apiUrl = eventSlug ? `/api/leaderboard/event/${eventSlug}` : `/api/leaderboard/round/${roundId || '1'}`;

async function load() {
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) {
      document.getElementById('content').innerHTML =
        `<div class="state-message">Võistlust/ringi ei leitud.</div>`;
      return;
    }
    const data = await res.json();
    render(data);
    document.getElementById('lastUpdated').textContent =
      'Uuendatud ' + new Date().toLocaleTimeString('et-EE');
  } catch (err) {
    document.getElementById('content').innerHTML =
      `<div class="state-message">Ühendus katkes. Proovime uuesti...</div>`;
  }
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
