<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Võistlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a1512; --bg-panel: #0f1e1a; --bg-panel-2: #142c25;
    --ink: #eaf2ee; --ink-dim: #7fa396; --ink-faint: #4d6a60;
    --line: rgba(234, 242, 238, 0.09); --accent: #ff6b35;
    --birdie: #4fbf82; --bogey: #e8974a; --double: #d9534f;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-deep); color: var(--ink); font-family: var(--font-body); min-height: 100vh; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
  h3 { font-family: var(--font-display); font-size: 14px; margin: 0 0 12px; color: var(--ink); }
  .back-link { color: var(--ink-faint); font-size: 12px; text-decoration: none; }
  label { display: block; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px; margin-top: 10px; }
  input, select, textarea {
    width: 100%; background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--font-body); font-size: 14px; padding: 9px 11px; border-radius: 7px;
  }
  .btn { display: inline-block; background: var(--accent); color: #1a0e08; border: none; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; padding: 9px 14px; border-radius: 7px; cursor: pointer; }
  .btn.secondary { background: var(--bg-panel-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.small { padding: 6px 11px; font-size: 11.5px; }
  .btn.full { width: 100%; margin-top: 14px; }
  .error-msg { color: var(--double); font-size: 12.5px; margin-top: 8px; min-height: 14px; }
  .ok-msg { color: var(--birdie); font-size: 12.5px; margin-top: 8px; min-height: 14px; }
  .tabs { display: flex; gap: 6px; margin: 16px 0; overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--ink-dim); font-family: var(--font-display); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tab.active { background: var(--bg-panel-2); color: var(--ink); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--ink-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  .status-pill { font-size: 10px; font-family: var(--font-display); font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; }
  .status-pill.registered { background: rgba(255,107,53,0.15); color: var(--accent); }
  .status-pill.confirmed { background: rgba(79,191,130,0.15); color: var(--birdie); }
  .status-pill.conflict { background: rgba(217,83,79,0.2); color: var(--double); }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: 100px; padding: 5px 11px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .chip .x { cursor: pointer; color: var(--ink-faint); }
  .empty-note { color: var(--ink-faint); font-size: 13px; }
  .hole-input-row { display: grid; grid-template-columns: 70px 70px 1fr 40px; gap: 8px; margin-bottom: 6px; align-items: center; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checkbox-row input { width: auto; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const params = new URLSearchParams(location.search);
const eventId = params.get('event');
const token = localStorage.getItem('dg_admin_token');
if (!token) location.href = '/admin';

const app = document.getElementById('app');
let state = {
  event: null, divisions: [], parks: [], rounds: [],
  activeTab: 'overview', selectedRoundId: null,
  registrations: [], holes: [], pools: [], conflicts: [],
};
let resetPinMessage = null;

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(opts?.headers || {}) },
  });
  const data = await res.json();
  if (res.status === 401) { location.href = '/admin'; throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(data.error || 'Viga');
  return data;
}

async function loadEvent() {
  app.innerHTML = `<div class="card">Laen...</div>`;
  try {
    const data = await api(`/api/admin/events/${eventId}`);
    state.event = data.event; state.divisions = data.divisions; state.parks = data.parks; state.rounds = data.rounds;
    if (!state.selectedRoundId && state.rounds[0]) state.selectedRoundId = state.rounds[0].id;
    render();
  } catch (e) {
    app.innerHTML = `<div class="card">Viga: ${e.message}</div>`;
  }
}

function render() {
  app.innerHTML = `
    <a class="back-link" href="/admin">← Kõik võistlused</a>
    <h1>${state.event.name}</h1>
    <div class="tabs">
      ${tabBtn('overview', 'Ülevaade')}
      ${tabBtn('registrations', 'Registreerumised')}
      ${tabBtn('rounds', 'Rajad & Poolid')}
      ${tabBtn('conflicts', 'Konfliktid')}
    </div>
    <div id="tabContent"></div>
  `;
  document.querySelectorAll('[data-tab]').forEach((el) => {
    el.onclick = () => { state.activeTab = el.dataset.tab; render(); };
  });
  renderTab();
}
function tabBtn(id, label) {
  return `<div class="tab ${state.activeTab === id ? 'active' : ''}" data-tab="${id}">${label}</div>`;
}

function renderTab() {
  const el = document.getElementById('tabContent');
  if (state.activeTab === 'overview') return renderOverview(el);
  if (state.activeTab === 'registrations') return renderRegistrations(el);
  if (state.activeTab === 'rounds') return renderRounds(el);
  if (state.activeTab === 'conflicts') return renderConflicts(el);
}

// ---------------------------------------------------------------------------
// OVERVIEW: status, divisions, parks
// ---------------------------------------------------------------------------
function renderOverview(el) {
  const statuses = ['draft','registration_open','registration_closed','live','finished','archived'];
  el.innerHTML = `
    <div class="card">
      <h3>Staatus</h3>
      <select id="statusSelect">${statuses.map((s) => `<option value="${s}" ${s===state.event.status?'selected':''}>${s}</option>`).join('')}</select>
      <button class="btn full" id="saveStatus">Salvesta staatus</button>
      <div class="ok-msg" id="statusMsg"></div>
    </div>

    <div class="card">
      <h3>Divisjonid</h3>
      <div class="chip-list">${state.divisions.map((d) => `<div class="chip">${d.name}<span class="x" data-del-div="${d.id}">✕</span></div>`).join('') || '<span class="empty-note">Pole veel lisatud.</span>'}</div>
      <div class="row2" style="margin-top:12px;">
        <input id="newDivName" placeholder="nt MPO">
        <button class="btn" id="addDiv">Lisa divisjon</button>
      </div>
    </div>

    <div class="card">
      <h3>Pargid / Sektorid</h3>
      <div class="chip-list">${state.parks.map((p) => `<div class="chip">${p.name}<span class="x" data-del-park="${p.id}">✕</span></div>`).join('') || '<span class="empty-note">Pole veel lisatud.</span>'}</div>
      <div class="row2" style="margin-top:12px;">
        <input id="newParkName" placeholder="nt Anne kanal">
        <button class="btn" id="addPark">Lisa park</button>
      </div>
    </div>
  `;
  document.getElementById('saveStatus').onclick = async () => {
    await api(`/api/admin/events/${eventId}`, { method: 'PATCH', body: JSON.stringify({ status: document.getElementById('statusSelect').value }) });
    document.getElementById('statusMsg').textContent = '✓ Salvestatud';
    loadEvent();
  };
  document.getElementById('addDiv').onclick = async () => {
    const name = document.getElementById('newDivName').value;
    if (!name) return;
    await api(`/api/admin/events/${eventId}/divisions`, { method: 'POST', body: JSON.stringify({ name, sortOrder: state.divisions.length }) });
    loadEvent();
  };
  document.getElementById('addPark').onclick = async () => {
    const name = document.getElementById('newParkName').value;
    if (!name) return;
    await api(`/api/admin/events/${eventId}/parks`, { method: 'POST', body: JSON.stringify({ name, sortOrder: state.parks.length }) });
    loadEvent();
  };
  document.querySelectorAll('[data-del-div]').forEach((x) => x.onclick = async () => { await api(`/api/admin/events/divisions/${x.dataset.delDiv}`, { method: 'DELETE' }); loadEvent(); });
  document.querySelectorAll('[data-del-park]').forEach((x) => x.onclick = async () => { await api(`/api/admin/events/parks/${x.dataset.delPark}`, { method: 'DELETE' }); loadEvent(); });
}

// ---------------------------------------------------------------------------
// REGISTRATIONS
// ---------------------------------------------------------------------------
async function renderRegistrations(el) {
  el.innerHTML = `<div class="card">Laen...</div>`;
  const data = await api(`/api/admin/registrations/event/${eventId}`);
  state.registrations = data.registrations;

  el.innerHTML = `
    <div class="card">
      <h3>Registreerumised (${state.registrations.length})</h3>
      ${resetPinMessage ? `<div style="background:rgba(79,191,130,0.1); border:1px solid var(--birdie); padding:12px; border-radius:8px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
        <span style="color:var(--birdie); font-family:var(--font-display); font-weight:600; font-size:13px;">${resetPinMessage}</span>
        <span id="dismissPinMsg" style="cursor:pointer; color:var(--ink-faint); margin-left:10px;">✕</span>
      </div>` : ''}
      ${state.registrations.length === 0 ? '<div class="empty-note">Registreerumisi pole veel.</div>' : `
      <table>
        <tr><th>Mängija</th><th>Divisjon</th><th>Staatus</th><th></th></tr>
        ${state.registrations.map((r) => `
          <tr>
            <td>${r.first_name} ${r.last_name}<br><span style="color:var(--ink-faint);font-size:11px;">#${r.player_number}</span></td>
            <td>${r.division_name}</td>
            <td><span class="status-pill ${r.status}">${r.status}</span></td>
            <td style="white-space:nowrap;">
              ${r.status !== 'confirmed' ? `<button class="btn small" data-confirm="${r.id}">Kinnita</button>` : ''}
              <button class="btn small secondary" data-reset-pin="${r.player_id}" data-player-name="${r.first_name} ${r.last_name}" style="margin-left:4px;">Lähtesta PIN</button>
            </td>
          </tr>`).join('')}
      </table>`}
    </div>

    <div class="card">
      <h3>Lisa mängija ilma kontota</h3>
      <div class="row3">
        <input id="apFirst" placeholder="Eesnimi">
        <input id="apLast" placeholder="Perekonnanimi">
        <select id="apDiv">${state.divisions.map((d) => `<option value="${d.id}">${d.name}</option>`).join('')}</select>
      </div>
      <button class="btn full" id="addPlayerBtn">Lisa mängija</button>
      <div class="error-msg" id="apError"></div>
    </div>
  `;
  document.querySelectorAll('[data-confirm]').forEach((btn) => {
    btn.onclick = async () => { await api(`/api/admin/registrations/${btn.dataset.confirm}`, { method: 'PATCH', body: JSON.stringify({ status: 'confirmed' }) }); renderTab(); };
  });
  document.querySelectorAll('[data-reset-pin]').forEach((btn) => {
    btn.onclick = async () => {
      const result = await api(`/api/admin/players/${btn.dataset.resetPin}/reset-pin`, { method: 'POST' });
      resetPinMessage = `Uus PIN mängijale ${btn.dataset.playerName}: ${result.newPin} — ütle see talle kohe, teine kord seda enam ei näe.`;
      renderTab();
    };
  });
  const dismissBtn = document.getElementById('dismissPinMsg');
  if (dismissBtn) dismissBtn.onclick = () => { resetPinMessage = null; renderTab(); };
  document.getElementById('addPlayerBtn').onclick = async () => {
    try {
      await api('/api/admin/registrations/add-player', {
        method: 'POST',
        body: JSON.stringify({
          eventId: Number(eventId), divisionId: Number(document.getElementById('apDiv').value),
          firstName: document.getElementById('apFirst').value, lastName: document.getElementById('apLast').value,
        }),
      });
      renderTab();
    } catch (e) { document.getElementById('apError').textContent = e.message; }
  };
}

// ---------------------------------------------------------------------------
// ROUNDS, HOLES, POOLS
// ---------------------------------------------------------------------------
async function renderRounds(el) {
  el.innerHTML = `
    <div class="card">
      <h3>Ringid</h3>
      <div class="chip-list">${state.rounds.map((r) => `<div class="chip" style="cursor:pointer; ${r.id===state.selectedRoundId?'border-color:var(--accent);color:var(--accent);':''}" data-select-round="${r.id}">${r.name || 'Round ' + r.round_number}</div>`).join('') || '<span class="empty-note">Pole veel lisatud.</span>'}</div>
      <div class="row2" style="margin-top:12px;">
        <input id="newRoundNum" type="number" placeholder="Round number">
        <button class="btn" id="addRound">Lisa ring</button>
      </div>
      ${state.selectedRoundId ? `<a href="/control-center?round=${state.selectedRoundId}" target="_blank" class="btn secondary full" style="margin-top:12px; text-align:center; text-decoration:none;">📊 Ava Control Center (reaalajas ülevaade)</a>` : ''}
    </div>
  `;
  document.querySelectorAll('[data-select-round]').forEach((c) => c.onclick = () => { state.selectedRoundId = Number(c.dataset.selectRound); renderTab(); });
  document.getElementById('addRound').onclick = async () => {
    const roundNumber = Number(document.getElementById('newRoundNum').value);
    if (!roundNumber) return;
    await api(`/api/admin/events/${eventId}/rounds`, { method: 'POST', body: JSON.stringify({ roundNumber }) });
    loadEvent();
  };

  if (!state.selectedRoundId) return;

  const holesData = await api(`/api/admin/events/rounds/${state.selectedRoundId}/holes`);
  state.holes = holesData.holes;
  const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
  state.pools = poolsData.pools;
  const regsData = await api(`/api/admin/registrations/event/${eventId}`);
  state.registrations = regsData.registrations;

  el.innerHTML += `
    <div class="card">
      <h3>Rajad (${state.holes.length})</h3>
      <table>
        <tr><th>#</th><th>Par</th><th>Park</th><th></th></tr>
        ${state.holes.map((h) => `
          <tr data-hole-row="${h.id}">
            <td><input type="number" class="editHn" value="${h.hole_number}" style="width:60px;"></td>
            <td><input type="number" class="editHp" value="${h.par}" style="width:60px;"></td>
            <td><select class="editHpark">${state.parks.map((p) => `<option value="${p.id}" ${p.id===h.park_id?'selected':''}>${p.name}</option>`).join('')}</select></td>
            <td style="white-space:nowrap;">
              <button class="btn secondary small" data-save-hole="${h.id}">Salvesta muudatus</button>
              <span style="cursor:pointer; color:var(--ink-faint); margin-left:6px;" data-delete-hole="${h.id}">✕</span>
            </td>
          </tr>`).join('') || ''}
      </table>
      <h3 style="margin-top:20px; padding-top:16px; border-top:1px solid var(--line);">🏞️ Lisa terve park korraga (nt "Harjumägi: rajad 1-14")</h3>
      <div class="row3">
        <select id="rangePark">${state.parks.map((p) => `<option value="${p.id}">${p.name}</option>`).join('')}</select>
        <input id="rangeStart" type="number" placeholder="Algus rada (nt 1)">
        <input id="rangeEnd" type="number" placeholder="Lõpp rada (nt 14)">
      </div>
      <div class="row2" style="margin-top:8px;">
        <input id="rangePar" type="number" placeholder="Par (kõigile, saab hiljem muuta)" value="3">
        <button class="btn secondary" id="generateRange">Genereeri read allpool ↓</button>
      </div>

      <h3 style="margin-top:20px; padding-top:16px; border-top:1px solid var(--line);">➕ Lisa UUED rajad (see ei muuda ülal olevaid)</h3>
      <div id="holeRows"></div>
      <button class="btn secondary small" id="addHoleRow">+ Rida</button>
      <button class="btn full" id="saveHoles">Lisa need uued rajad</button>
      <div class="error-msg" id="holesError"></div>
      <div class="error-msg" id="rangeError"></div>
    </div>

    <div class="card">
      <h3>Poolid</h3>
      <div class="row3">
        <input id="bulkPoolCount" type="number" placeholder="Mitu poolid luua">
        <input id="bulkPoolMax" type="number" placeholder="Max mängijaid/pool" value="4">
        <input id="bulkStartHole" type="number" placeholder="Start hole (kõigil)" value="1">
      </div>
      <button class="btn full" id="bulkCreatePools" style="margin-top:8px;">Loo poolid korraga</button>
      <div class="error-msg" id="bulkPoolStatus"></div>

      <div style="display:flex; gap:16px; margin-top:20px; flex-wrap:wrap; align-items:flex-start;">
        <div style="flex:0 0 200px; min-width:180px;">
          <h3 style="margin:0 0 8px;">Sidumata mängijad</h3>
          <input id="unassignedSearch" placeholder="Otsi nime...">
          <div id="unassignedList" data-drop-zone="unassigned" style="min-height:60px; border:1px dashed var(--line); border-radius:8px; padding:8px; margin-top:8px;"></div>
        </div>
        <div id="poolGrid" style="flex:1; min-width:240px; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px;"></div>
      </div>
    </div>
  `;

  addHoleRow();
  document.getElementById('addHoleRow').onclick = addHoleRow;
  document.getElementById('generateRange').onclick = generateRangeRows;
  document.getElementById('saveHoles').onclick = saveHoles;
  document.getElementById('bulkCreatePools').onclick = bulkCreatePools;
  document.querySelectorAll('[data-save-hole]').forEach((btn) => {
    btn.onclick = async () => {
      const row = btn.closest('tr');
      await api(`/api/admin/events/holes/${btn.dataset.saveHole}`, {
        method: 'PATCH',
        body: JSON.stringify({
          holeNumber: Number(row.querySelector('.editHn').value),
          par: Number(row.querySelector('.editHp').value),
          parkId: Number(row.querySelector('.editHpark').value),
        }),
      });
      renderTab();
    };
  });
  document.querySelectorAll('[data-delete-hole]').forEach((x) => {
    x.onclick = async () => { await api(`/api/admin/events/holes/${x.dataset.deleteHole}`, { method: 'DELETE' }); renderTab(); };
  });

  renderPoolBuilder();
  document.getElementById('unassignedSearch').oninput = renderPoolBuilder;
}

// ---------------------------------------------------------------------------
// DRAG-AND-DROP POOL BUILDER
// ---------------------------------------------------------------------------
function renderPoolBuilder() {
  const assignedPlayerIds = new Set(state.pools.flatMap((p) => (p.players || []).map((pl) => pl.player_id)));
  const search = (document.getElementById('unassignedSearch')?.value || '').toLowerCase();
  const unassigned = state.registrations.filter((r) =>
    !assignedPlayerIds.has(r.player_id) &&
    ['registered', 'confirmed'].includes(r.status) &&
    `${r.first_name} ${r.last_name}`.toLowerCase().includes(search)
  );

  document.getElementById('unassignedList').innerHTML = unassigned.length
    ? unassigned.map((r) => playerChip(r.first_name, r.last_name, r.id, null)).join('')
    : '<div class="empty-note">Kõik on poolidesse jaotatud.</div>';

  document.getElementById('poolGrid').innerHTML = state.pools.map((p) => `
    <div class="pool-drop" data-drop-zone="${p.id}" style="border:1px solid var(--line); border-radius:10px; padding:10px; min-height:90px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <strong style="font-size:13px;">Pool ${p.pool_number}</strong>
        <span style="font-size:10.5px; color:${p.max_players && (p.players||[]).length >= p.max_players ? 'var(--bogey)' : 'var(--ink-faint)'};">
          ${(p.players||[]).length}${p.max_players ? '/'+p.max_players : ''}
        </span>
      </div>
      <div class="chip-list">
        ${(p.players || []).map((pl) => playerChip(pl.first_name, pl.last_name, pl.registration_id, pl.pool_player_id)).join('') || '<span class="empty-note" style="font-size:11px;">Lohista siia</span>'}
      </div>
    </div>`).join('') || '<div class="empty-note">Loo kõigepealt vähemalt üks pool ülal.</div>';

  wireDragAndDrop();
}

function playerChip(first, last, registrationId, poolPlayerId) {
  const payload = JSON.stringify({ registrationId, poolPlayerId }).replace(/"/g, '&quot;');
  return `<div class="chip" draggable="true" data-drag-payload="${payload}" style="cursor:grab;">${first} ${last}</div>`;
}

function wireDragAndDrop() {
  document.querySelectorAll('[data-drag-payload]').forEach((chip) => {
    chip.ondragstart = (e) => {
      e.dataTransfer.setData('text/plain', chip.dataset.dragPayload);
      e.dataTransfer.effectAllowed = 'move';
    };
  });

  document.querySelectorAll('[data-drop-zone]').forEach((zone) => {
    zone.ondragover = (e) => { e.preventDefault(); zone.style.background = 'rgba(255,107,53,0.08)'; };
    zone.ondragleave = () => { zone.style.background = ''; };
    zone.ondrop = async (e) => {
      e.preventDefault();
      zone.style.background = '';
      const raw = e.dataTransfer.getData('text/plain');
      if (!raw) return;
      const payload = JSON.parse(raw.replace(/&quot;/g, '"'));
      const targetZone = zone.dataset.dropZone;

      // Kui mängija oli juba mõnes poolis, eemalda ta sealt esmalt
      if (payload.poolPlayerId) {
        await api(`/api/admin/pools/players/${payload.poolPlayerId}`, { method: 'DELETE' });
      }
      // Kui sihtmärk on pärismaine pool (mitte "unassigned"), lisa ta sinna
      if (targetZone !== 'unassigned') {
        await api(`/api/admin/pools/${targetZone}/players`, {
          method: 'POST',
          body: JSON.stringify({ registrationId: payload.registrationId }),
        });
      }
      const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
      state.pools = poolsData.pools;
      renderPoolBuilder();
    };
  });
}

async function bulkCreatePools() {
  const btn = document.getElementById('bulkCreatePools');
  const statusEl = document.getElementById('bulkPoolStatus');
  const count = Number(document.getElementById('bulkPoolCount').value);
  const maxPlayers = Number(document.getElementById('bulkPoolMax').value) || null;
  const startHole = Number(document.getElementById('bulkStartHole').value) || 1;
  if (!count || count < 1) { statusEl.textContent = 'Sisesta, mitu pooli soovid luua.'; return; }
  if (count > 200) { statusEl.textContent = 'Liiga palju korraga (max 200).'; return; }

  btn.disabled = true;
  btn.textContent = 'Loon poole...';
  statusEl.style.color = 'var(--ink-dim)';

  const existingNumbers = state.pools.map((p) => p.pool_number);
  const nextNumber = existingNumbers.length ? Math.max(...existingNumbers) + 1 : 1;

  let created = 0;
  const errors = [];
  for (let i = 0; i < count; i++) {
    statusEl.textContent = `Loon poole... ${i + 1}/${count}`;
    try {
      await api(`/api/admin/pools/rounds/${state.selectedRoundId}`, {
        method: 'POST',
        body: JSON.stringify({ poolNumber: nextNumber + i, maxPlayers, startHole }),
      });
      created++;
    } catch (err) {
      errors.push(`Pool ${nextNumber + i}: ${err.message}`);
    }
  }

  btn.disabled = false;
  btn.textContent = 'Loo poolid korraga';
  statusEl.style.color = errors.length ? 'var(--double)' : 'var(--birdie)';
  statusEl.textContent = errors.length
    ? `Loodud ${created}/${count}. Vead: ${errors.slice(0, 3).join('; ')}${errors.length > 3 ? ' ...' : ''}`
    : `✓ Loodud ${created} pooli.`;

  const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
  state.pools = poolsData.pools;
  renderPoolBuilder();
}

function addHoleRow(presetNum, presetPar, presetParkId) {
  const container = document.getElementById('holeRows');
  const row = document.createElement('div');
  row.className = 'hole-input-row';
  const nextNum = presetNum ?? (container.children.length + state.holes.length + 1);
  const nextPar = presetPar ?? 3;
  row.innerHTML = `
    <input type="number" class="hn" placeholder="Rada" value="${nextNum}">
    <input type="number" class="hp" placeholder="Par" value="${nextPar}">
    <select class="hpark">${state.parks.map((p) => `<option value="${p.id}" ${presetParkId && p.id === presetParkId ? 'selected' : ''}>${p.name}</option>`).join('')}</select>
    <span style="cursor:pointer; color:var(--ink-faint);" onclick="this.parentElement.remove()">✕</span>`;
  container.appendChild(row);
}

function generateRangeRows() {
  const parkId = Number(document.getElementById('rangePark').value);
  const start = Number(document.getElementById('rangeStart').value);
  const end = Number(document.getElementById('rangeEnd').value);
  const par = Number(document.getElementById('rangePar').value) || 3;
  const errorEl = document.getElementById('rangeError');
  errorEl.textContent = '';

  if (!start || !end || start > end) {
    errorEl.textContent = 'Sisesta korrektne algus- ja lõpurada (algus peab olema väiksem või võrdne lõpuga).';
    return;
  }
  if (end - start > 200) {
    errorEl.textContent = 'Liiga suur vahemik korraga (max 200 rada).';
    return;
  }

  document.getElementById('holeRows').innerHTML = '';
  for (let n = start; n <= end; n++) {
    addHoleRow(n, par, parkId);
  }
}

async function saveHoles() {
  const rows = [...document.querySelectorAll('#holeRows .hole-input-row')];
  const holes = rows.map((r) => ({
    holeNumber: Number(r.querySelector('.hn').value),
    par: Number(r.querySelector('.hp').value),
    parkId: Number(r.querySelector('.hpark').value),
  })).filter((h) => h.holeNumber && h.par);
  if (holes.length === 0) return;
  try {
    await api(`/api/admin/events/rounds/${state.selectedRoundId}/holes`, { method: 'POST', body: JSON.stringify({ holes }) });
    renderTab();
  } catch (e) { document.getElementById('holesError').textContent = e.message; }
}

async function createPool() {
  const poolNumber = Number(document.getElementById('poolNum').value);
  const startHole = Number(document.getElementById('poolStartHole').value) || 1;
  const maxPlayers = Number(document.getElementById('poolMaxPlayers').value) || null;
  const requireDoubleVerification = document.getElementById('poolDoubleVerify').checked;
  if (!poolNumber) return;
  await api(`/api/admin/pools/rounds/${state.selectedRoundId}`, { method: 'POST', body: JSON.stringify({ poolNumber, startHole, maxPlayers, requireDoubleVerification }) });
  renderTab();
}

// ---------------------------------------------------------------------------
// CONFLICTS
// ---------------------------------------------------------------------------
async function renderConflicts(el) {
  if (!state.selectedRoundId) { el.innerHTML = `<div class="card empty-note">Vali kõigepealt ring "Rajad & Poolid" alt.</div>`; return; }
  const data = await api(`/api/admin/scores/conflicts/round/${state.selectedRoundId}`);
  state.conflicts = data.conflicts;
  el.innerHTML = `
    <div class="card">
      <h3>Lahendamata konfliktid (${state.conflicts.length})</h3>
      ${state.conflicts.length === 0 ? '<div class="empty-note">Konflikte pole. 🎉</div>' : state.conflicts.map((c) => `
        <div style="border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px;">
          <div><strong>${c.first_name} ${c.last_name}</strong> · Rada ${c.hole_number}</div>
          <div style="font-size:12.5px; color:var(--ink-dim); margin:4px 0 10px;">Salvestatud: ${c.existing_value} · Üritati: ${c.attempted_value}</div>
          <div class="row2">
            <input type="number" class="resVal" placeholder="Õige tulemus" value="${c.existing_value}">
            <input class="resReason" placeholder="Põhjus">
          </div>
          <button class="btn small" style="margin-top:8px;" data-resolve="${c.id}">Lahenda</button>
        </div>`).join('')}
    </div>
  `;
  document.querySelectorAll('[data-resolve]').forEach((btn) => {
    btn.onclick = async () => {
      const card = btn.closest('div');
      const resolutionValue = Number(card.querySelector('.resVal').value);
      const reason = card.querySelector('.resReason').value;
      await api(`/api/admin/scores/conflicts/${btn.dataset.resolve}`, { method: 'PATCH', body: JSON.stringify({ resolutionValue, reason }) });
      renderTab();
    };
  });
}

loadEvent();
</script>
