<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Võistlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #2a3733; --bg-panel: #33423d; --bg-panel-2: #3d4d47;
    --ink: #f0f4f2; --ink-dim: #b8c9c2; --ink-faint: #8aa198;
    --line: rgba(240, 244, 242, 0.12); --accent: #ff6b35;
    --birdie: #5fcf8f; --bogey: #f0a94e; --double: #e2635e;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-deep); color: var(--ink); font-family: var(--font-body); min-height: 100vh; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
  h3 { font-family: var(--font-display); font-size: 14px; margin: 0 0 12px; color: var(--ink); }
  .back-link { color: var(--ink-faint); font-size: 12px; text-decoration: none; }
  label { display: block; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px; margin-top: 10px; }
  input, select, textarea {
    width: 100%; background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--font-body); font-size: 14px; padding: 9px 11px; border-radius: 7px;
  }
  .btn { display: inline-block; background: var(--accent); color: #1a0e08; border: none; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; padding: 9px 14px; border-radius: 7px; cursor: pointer; }
  .btn.secondary { background: var(--bg-panel-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.small { padding: 6px 11px; font-size: 11.5px; }
  .btn.full { width: 100%; margin-top: 14px; }
  .error-msg { color: var(--double); font-size: 12.5px; margin-top: 8px; min-height: 14px; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto; background: var(--bg-panel-2); border-radius: 16px; padding: 20px; }
  .ok-msg { color: var(--birdie); font-size: 12.5px; margin-top: 8px; min-height: 14px; }
  .tabs { display: flex; gap: 6px; margin: 16px 0; overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--ink-dim); font-family: var(--font-display); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tab.active { background: var(--bg-panel-2); color: var(--ink); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--ink-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  .status-pill { font-size: 10px; font-family: var(--font-display); font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; }
  .status-pill.registered { background: rgba(255,107,53,0.15); color: var(--accent); }
  .status-pill.confirmed { background: rgba(79,191,130,0.15); color: var(--birdie); }
  .status-pill.conflict { background: rgba(217,83,79,0.2); color: var(--double); }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: 100px; padding: 5px 11px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .chip .x { cursor: pointer; color: var(--ink-faint); }
  .empty-note { color: var(--ink-faint); font-size: 13px; }
  .hole-input-row { display: grid; grid-template-columns: 70px 70px 1fr 40px; gap: 8px; margin-bottom: 6px; align-items: center; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checkbox-row input { width: auto; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="modal-backdrop" id="movePlayerModal">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="font-family:var(--font-display); margin:0;">Liiguta mängija...</h3>
      <span id="movePlayerClose" style="cursor:pointer; color:var(--ink-faint); font-size:20px;">✕</span>
    </div>
    <div id="movePlayerGrid"></div>
  </div>
</div>

<div class="modal-backdrop" id="logModal">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="font-family:var(--font-display); margin:0;">📝 Enda tulemuse parandused</h3>
      <span id="logModalClose" style="cursor:pointer; color:var(--ink-faint); font-size:20px;">✕</span>
    </div>
    <p style="color:var(--ink-faint); font-size:12px; margin-top:-6px;">
      Siin näed, millal märkija on tagantjärele muutnud enda varem sisestatud tulemust.
      Kui kaks eri inimest sisestavad erineva tulemuse, tekib selle asemel konflikt (vt "Konfliktid" vahekaart).
    </p>
    <div id="logModalBody">Laen...</div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Teema valik (RAL värvid admin-vaate tausta jaoks)
// ---------------------------------------------------------------------------
const ADMIN_THEMES = {
  default: { '--bg-deep': '#2a3733', '--bg-panel': '#33423d', '--bg-panel-2': '#3d4d47', '--ink': '#f0f4f2', '--ink-dim': '#b8c9c2', '--ink-faint': '#8aa198', '--line': 'rgba(240, 244, 242, 0.12)', '--birdie': '#5fcf8f', '--bogey': '#f0a94e', '--double': '#e2635e' },
  ral7040: { '--bg-deep': '#9DA3A7', '--bg-panel': '#ffffff', '--bg-panel-2': '#e4e6e7', '--ink': '#1e2224', '--ink-dim': '#4a5153', '--ink-faint': '#7c8386', '--line': 'rgba(30, 34, 36, 0.14)', '--birdie': '#2e9d5c', '--bogey': '#c97a1f', '--double': '#c94444' },
  ral6027: { '--bg-deep': '#7EBAB5', '--bg-panel': '#ffffff', '--bg-panel-2': '#dceeec', '--ink': '#16302c', '--ink-dim': '#3f615c', '--ink-faint': '#6f8f8a', '--line': 'rgba(22, 48, 44, 0.14)', '--birdie': '#2e9d5c', '--bogey': '#c97a1f', '--double': '#c94444' },
};
function applyAdminTheme(name) {
  const theme = ADMIN_THEMES[name] || ADMIN_THEMES.default;
  Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  localStorage.setItem('dg_admin_theme', name);
}
function themeSelectorHtml() {
  const current = localStorage.getItem('dg_admin_theme') || 'default';
  return `<select id="themeSelector" style="width:auto; padding:5px 8px; font-size:11.5px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink); border-radius:6px;">
    <option value="default" ${current === 'default' ? 'selected' : ''}>Vaikimisi</option>
    <option value="ral7040" ${current === 'ral7040' ? 'selected' : ''}>RAL 7040</option>
    <option value="ral6027" ${current === 'ral6027' ? 'selected' : ''}>RAL 6027</option>
  </select>`;
}
function wireThemeSelector() {
  const el = document.getElementById('themeSelector');
  if (el) el.onchange = (e) => applyAdminTheme(e.target.value);
}
applyAdminTheme(localStorage.getItem('dg_admin_theme') || 'default');

const params = new URLSearchParams(location.search);
const eventId = params.get('event');
const token = localStorage.getItem('dg_admin_token');
if (!token) location.href = '/admin';

const app = document.getElementById('app');
let state = {
  event: null, divisions: [], parks: [], rounds: [],
  activeTab: 'overview', selectedRoundId: null,
  registrations: [], holes: [], pools: [], conflicts: [],
};
let resetPinMessage = null;

document.getElementById('movePlayerClose').onclick = () => document.getElementById('movePlayerModal').classList.remove('show');
document.getElementById('movePlayerModal').onclick = (e) => { if (e.target.id === 'movePlayerModal') e.currentTarget.classList.remove('show'); };
document.getElementById('logModalClose').onclick = () => document.getElementById('logModal').classList.remove('show');
document.getElementById('logModal').onclick = (e) => { if (e.target.id === 'logModal') e.currentTarget.classList.remove('show'); };

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(opts?.headers || {}) },
  });
  const data = await res.json();
  if (res.status === 401) { location.href = '/admin'; throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(data.error || 'Viga');
  return data;
}

async function loadEvent() {
  app.innerHTML = `<div class="card">Laen...</div>`;
  try {
    const data = await api(`/api/admin/events/${eventId}`);
    state.event = data.event; state.divisions = data.divisions; state.parks = data.parks; state.rounds = data.rounds;
    if (!state.selectedRoundId && state.rounds[0]) state.selectedRoundId = state.rounds[0].id;
    render();
  } catch (e) {
    app.innerHTML = `<div class="card">Viga: ${e.message}</div>`;
  }
}

function render() {
  app.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <a class="back-link" href="/admin">← Kõik võistlused</a>
      <div style="display:flex; gap:8px; align-items:center;">
        ${themeSelectorHtml()}
        <a class="btn secondary small" href="/leaderboard?event=${state.event.slug}" target="_blank" style="text-decoration:none;">🏆 Tulemused</a>
        <button class="btn secondary small" id="openLogBtn">📝 Logi</button>
      </div>
    </div>
    <h1>${state.event.name}</h1>
    <div class="tabs">
      ${tabBtn('overview', 'Ülevaade')}
      ${tabBtn('registrations', 'Registreerumised')}
      ${tabBtn('rounds', 'Rajad & Poolid')}
      ${tabBtn('conflicts', 'Konfliktid')}
      ${tabBtn('announcements', 'Teated')}
      ${tabBtn('jokes', 'Anekdoodid')}
    </div>
    <div id="tabContent"></div>
  `;
  document.querySelectorAll('[data-tab]').forEach((el) => {
    el.onclick = () => { state.activeTab = el.dataset.tab; render(); };
  });
  document.getElementById('openLogBtn').onclick = openSelfCorrectionLog;
  wireThemeSelector();
  renderTab();
}
function tabBtn(id, label) {
  return `<div class="tab ${state.activeTab === id ? 'active' : ''}" data-tab="${id}">${label}</div>`;
}

function renderTab() {
  const el = document.getElementById('tabContent');
  if (state.activeTab === 'overview') return renderOverview(el);
  if (state.activeTab === 'registrations') return renderRegistrations(el);
  if (state.activeTab === 'rounds') return renderRounds(el);
  if (state.activeTab === 'conflicts') return renderConflicts(el);
  if (state.activeTab === 'announcements') return renderAnnouncements(el);
  if (state.activeTab === 'jokes') return renderJokes(el);
}

// ---------------------------------------------------------------------------
// TEATED (announcements) - eraldi tab, endine osa "Ülevaade" alt
// ---------------------------------------------------------------------------
async function renderAnnouncements(el) {
  el.innerHTML = `<div class="card">Laen...</div>`;
  let announcements = [];
  try {
    const annData = await api(`/api/admin/announcements/${eventId}`);
    announcements = annData.announcements;
  } catch (e) { /* pole hullu, näita lihtsalt tühja ajalugu */ }

  el.innerHTML = `
    <div class="card">
      <h3>📢 Kiirteade mängijatele</h3>
      <p style="color:var(--ink-faint); font-size:12.5px; margin-top:-6px;">Ilmub hüpikteatena kõigile, kes hetkel selle event'i scorecard'il on (nt "Ring peatatud äikese tõttu").</p>
      <textarea id="announceText" placeholder="nt Autasustamine algab 18:00 stardialal." style="width:100%; min-height:70px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-family:var(--font-body); font-size:14px; resize:vertical;"></textarea>
      <button class="btn full" id="sendAnnounceBtn" style="margin-top:10px;">Saada kõigile</button>
      <div class="ok-msg" id="announceStatus"></div>
      ${announcements.length > 0 ? `
        <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line);">
          <div style="font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;">Varasemad teated</div>
          ${announcements.map((a) => `
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; font-size:12.5px; color:var(--ink-dim); padding:5px 0;">
              <span>${new Date(a.created_at).toLocaleTimeString('et-EE')} — ${a.message}</span>
              <span data-del-announce="${a.id}" title="Kustuta teade" style="cursor:pointer; color:var(--double); flex-shrink:0;">✕</span>
            </div>`).join('')}
        </div>` : ''}
    </div>
  `;
  document.querySelectorAll('[data-del-announce]').forEach((x) => {
    x.onclick = async () => {
      const ok = confirm('Kustutada see teade? Kui see on veel kellegi scorecardil hüpikuna nähtaval, jääb see nähtavaks, aga edaspidi seda enam ei näidata.');
      if (!ok) return;
      try {
        await api(`/api/admin/announcements/${x.dataset.delAnnounce}`, { method: 'DELETE' });
        renderTab();
      } catch (e) { alert('Viga: ' + e.message); }
    };
  });
  document.getElementById('sendAnnounceBtn').onclick = async () => {
    const text = document.getElementById('announceText').value.trim();
    const statusEl = document.getElementById('announceStatus');
    statusEl.textContent = '';
    if (!text) return;
    try {
      await api(`/api/admin/announcements/${eventId}`, { method: 'POST', body: JSON.stringify({ message: text }) });
      statusEl.style.color = 'var(--birdie)';
      statusEl.textContent = '✓ Saadetud';
      document.getElementById('announceText').value = '';
      setTimeout(renderTab, 1200);
    } catch (e) {
      statusEl.style.color = 'var(--double)';
      statusEl.textContent = 'Viga: ' + e.message;
    }
  };
}

// ---------------------------------------------------------------------------
// ANEKDOODID (jokes) - eraldi tab, endine osa "Ülevaade" alt
// ---------------------------------------------------------------------------
async function renderJokes(el) {
  el.innerHTML = `<div class="card">Laen...</div>`;
  let jokes = [];
  try {
    const jokeData = await api(`/api/admin/jokes?eventId=${eventId}`);
    jokes = jokeData.jokes;
  } catch (e) { /* pole hullu, näita lihtsalt tühja nimekirja */ }

  el.innerHTML = `
    <div class="card">
      <h3>😄 Anekdoodi-mallid</h3>
      <p style="color:var(--ink-faint); font-size:12.5px; margin-top:-6px;">
        Kuvatakse mängijatele raja lõpus, ainult SELLE võistluse siseselt. Kasuta {P1}, {P2}, {P3}, {P4}...
        kohatäitjaid - need asendatakse automaatselt selle pooli päris mängijate eesnimedega.<br>
        Näide: "{P1}, {P2}, {P3} ja {P4} läksid baari..."<br>
        Kui poolis on vähem mängijaid kui mall vajab, täidetakse ülejäänud kohad naljaka täitenimega.<br>
        <strong>Üldine anekdoot</strong> (rada number tühi): näidatakse ainult ÜKS KORD, seejärel ei tule enam - "↺ Taasta" nupuga saab uuesti aktiivseks teha.<br>
        <strong>Rada number:</strong> kui määrad, kuvatakse see anekdoot GARANTEERITULT sellel rajal (ei kulu ära).
      </p>
      <textarea id="newJokeText" placeholder="{P1}, {P2}, {P3} ja {P4} läksid baari..." style="width:100%; min-height:70px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-family:var(--font-body); font-size:14px; resize:vertical;"></textarea>
      <label style="font-size:12px; color:var(--ink-faint); margin-top:8px; display:block;">Rada number (valikuline)</label>
      <input id="newJokeHole" type="number" min="1" placeholder="Tühjaks jätmisel läheb üldisesse juhuslikku valikusse" style="margin-top:4px;">
      <button class="btn full" id="addJokeBtn" style="margin-top:8px;">Lisa anekdoot</button>
      <div class="error-msg" id="jokeError"></div>
      <div id="jokesList" style="margin-top:16px;">
        ${jokes.length === 0 ? '<div class="empty-note">Ühtegi anekdooti pole veel lisatud.</div>' : jokes.map((j) => `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);">
            <div>
              ${j.hole_number ? `<span style="display:inline-block; background:var(--accent); color:#1a0e08; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; margin-bottom:4px;">RADA ${j.hole_number}</span>` : ''}
              ${!j.hole_number && j.used_at ? `<span style="display:inline-block; background:var(--ink-faint); color:var(--bg-deep); font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; margin-bottom:4px;">✓ NÄIDATUD</span>` : ''}
              ${!j.hole_number && !j.used_at ? `<span style="display:inline-block; background:var(--birdie); color:var(--bg-deep); font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; margin-bottom:4px;">OOTEL</span>` : ''}
              <br><span style="font-size:13px; color:var(--ink-dim);">${j.template_text}</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0;">
              <span data-del-joke="${j.id}" style="cursor:pointer; color:var(--double);">✕</span>
              ${!j.hole_number && j.used_at ? `<span data-reset-joke="${j.id}" style="cursor:pointer; color:var(--accent); font-size:11px; white-space:nowrap;">↺ Taasta</span>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>
  `;
  document.getElementById('addJokeBtn').onclick = async () => {
    const text = document.getElementById('newJokeText').value.trim();
    const holeNumber = document.getElementById('newJokeHole').value;
    const errEl = document.getElementById('jokeError');
    errEl.textContent = '';
    if (!text) return;
    try {
      await api(`/api/admin/jokes`, {
        method: 'POST',
        body: JSON.stringify({ eventId, templateText: text, holeNumber: holeNumber ? Number(holeNumber) : null }),
      });
      renderTab();
    } catch (e) { errEl.textContent = 'Viga: ' + e.message; }
  };
  document.querySelectorAll('[data-del-joke]').forEach((el) => {
    el.onclick = async () => { await api(`/api/admin/jokes/${el.dataset.delJoke}`, { method: 'DELETE' }); renderTab(); };
  });
  document.querySelectorAll('[data-reset-joke]').forEach((el) => {
    el.onclick = async () => { await api(`/api/admin/jokes/${el.dataset.resetJoke}/reset`, { method: 'POST' }); renderTab(); };
  });
}

// ---------------------------------------------------------------------------
// OVERVIEW: status, divisions, parks
// ---------------------------------------------------------------------------
async function renderOverview(el) {
  const statuses = ['draft','registration_open','registration_closed','live','finished','archived'];

  el.innerHTML = `
    <div class="card">
      <h3>Staatus</h3>
      <select id="statusSelect">${statuses.map((s) => `<option value="${s}" ${s===state.event.status?'selected':''}>${s}</option>`).join('')}</select>
      <button class="btn full" id="saveStatus">Salvesta staatus</button>
      <div class="ok-msg" id="statusMsg"></div>
    </div>

    <div class="card">
      <h3>Divisjonid</h3>
      <div class="chip-list">${state.divisions.map((d) => `<div class="chip">${d.name}<span class="x" data-del-div="${d.id}">✕</span></div>`).join('') || '<span class="empty-note">Pole veel lisatud.</span>'}</div>
      <div class="row2" style="margin-top:12px;">
        <input id="newDivName" placeholder="nt MPO">
        <button class="btn" id="addDiv">Lisa divisjon</button>
      </div>
    </div>

    <div class="card">
      <h3>Pargid / Sektorid</h3>
      <div class="chip-list">${state.parks.map((p) => `<div class="chip">${p.name}<span class="x" data-del-park="${p.id}">✕</span></div>`).join('') || '<span class="empty-note">Pole veel lisatud.</span>'}</div>
      <div class="row2" style="margin-top:12px;">
        <input id="newParkName" placeholder="nt Anne kanal">
        <button class="btn" id="addPark">Lisa park</button>
      </div>
    </div>
  `;
  document.getElementById('saveStatus').onclick = async () => {
    await api(`/api/admin/events/${eventId}`, { method: 'PATCH', body: JSON.stringify({ status: document.getElementById('statusSelect').value }) });
    document.getElementById('statusMsg').textContent = '✓ Salvestatud';
    loadEvent();
  };
  document.getElementById('addDiv').onclick = async () => {
    const name = document.getElementById('newDivName').value;
    if (!name) return;
    await api(`/api/admin/events/${eventId}/divisions`, { method: 'POST', body: JSON.stringify({ name, sortOrder: state.divisions.length }) });
    loadEvent();
  };
  document.getElementById('addPark').onclick = async () => {
    const name = document.getElementById('newParkName').value;
    if (!name) return;
    await api(`/api/admin/events/${eventId}/parks`, { method: 'POST', body: JSON.stringify({ name, sortOrder: state.parks.length }) });
    loadEvent();
  };
  document.querySelectorAll('[data-del-div]').forEach((x) => x.onclick = async () => { await api(`/api/admin/events/divisions/${x.dataset.delDiv}`, { method: 'DELETE' }); loadEvent(); });
  document.querySelectorAll('[data-del-park]').forEach((x) => x.onclick = async () => { await api(`/api/admin/events/parks/${x.dataset.delPark}`, { method: 'DELETE' }); loadEvent(); });
}

// ---------------------------------------------------------------------------
// REGISTRATIONS
// ---------------------------------------------------------------------------
async function renderRegistrations(el) {
  el.innerHTML = `<div class="card">Laen...</div>`;
  const data = await api(`/api/admin/registrations/event/${eventId}`);
  state.registrations = data.registrations;

  el.innerHTML = `
    <div class="card">
      <h3>Registreerumised (${state.registrations.length})</h3>
      ${resetPinMessage ? `<div style="background:rgba(79,191,130,0.1); border:1px solid var(--birdie); padding:12px; border-radius:8px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
        <span style="color:var(--birdie); font-family:var(--font-display); font-weight:600; font-size:13px;">${resetPinMessage}</span>
        <span id="dismissPinMsg" style="cursor:pointer; color:var(--ink-faint); margin-left:10px;">✕</span>
      </div>` : ''}
      ${state.registrations.length === 0 ? '<div class="empty-note">Registreerumisi pole veel.</div>' : `
      <table>
        <tr><th>Mängija</th><th>Divisjon</th><th>Staatus</th><th></th></tr>
        ${state.registrations.map((r) => `
          <tr>
            <td>${r.first_name} ${r.last_name}<br><span style="color:var(--ink-faint);font-size:11px;">#${r.player_number}</span></td>
            <td>${r.division_name}</td>
            <td><span class="status-pill ${r.status}">${r.status}</span></td>
            <td style="white-space:nowrap;">
              ${r.status !== 'confirmed' ? `<button class="btn small" data-confirm="${r.id}">Kinnita</button>` : ''}
              <button class="btn small secondary" data-reset-pin="${r.player_id}" data-player-name="${r.first_name} ${r.last_name}" style="margin-left:4px;">Lähtesta PIN</button>
              <span data-remove-reg="${r.id}" data-reg-name="${r.first_name} ${r.last_name}" style="cursor:pointer; color:var(--double); font-size:11px; margin-left:8px; white-space:nowrap;">Eemalda</span>
            </td>
          </tr>`).join('')}
      </table>`}
    </div>

    <div class="card">
      <h3>Lisa mängija ilma kontota</h3>
      <div class="row3">
        <div style="position:relative;">
          <input id="apFirst" placeholder="Eesnimi" autocomplete="off">
          <div id="apSuggestions" style="display:none; position:absolute; top:100%; left:0; right:0; background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; margin-top:4px; z-index:10; max-height:220px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,0.25);"></div>
        </div>
        <input id="apLast" placeholder="Perekonnanimi">
        <select id="apDiv">${state.divisions.map((d) => `<option value="${d.id}">${d.name}</option>`).join('')}</select>
      </div>
      <div id="apSelectedBadge" style="display:none; margin-top:8px;"></div>
      <button class="btn full" id="addPlayerBtn" style="margin-top:8px;">Lisa mängija</button>
      <div class="error-msg" id="apError"></div>
    </div>
  `;
  document.querySelectorAll('[data-confirm]').forEach((btn) => {
    btn.onclick = async () => { await api(`/api/admin/registrations/${btn.dataset.confirm}`, { method: 'PATCH', body: JSON.stringify({ status: 'confirmed' }) }); renderTab(); };
  });
  document.querySelectorAll('[data-reset-pin]').forEach((btn) => {
    btn.onclick = async () => {
      const result = await api(`/api/admin/players/${btn.dataset.resetPin}/reset-pin`, { method: 'POST' });
      resetPinMessage = `Uus PIN mängijale ${btn.dataset.playerName}: ${result.newPin} — ütle see talle kohe, teine kord seda enam ei näe.`;
      renderTab();
    };
  });
  const dismissBtn = document.getElementById('dismissPinMsg');
  if (dismissBtn) dismissBtn.onclick = () => { resetPinMessage = null; renderTab(); };
  document.querySelectorAll('[data-remove-reg]').forEach((el) => {
    el.onclick = async () => {
      const ok = confirm(`Kindel, et tahad eemaldada "${el.dataset.regName}" registreerimise?\n\nSee kustutab tema registreerimise ja pooli-valiku selle võistluse jaoks jäädavalt. Seda ei saa tagasi võtta.`);
      if (!ok) return;
      try {
        await api(`/api/admin/registrations/${el.dataset.removeReg}`, { method: 'DELETE' });
        renderTab();
      } catch (e) { alert('Viga: ' + e.message); }
    };
  });

  let selectedExistingPlayerId = null;
  const apFirstInput = document.getElementById('apFirst');
  const apLastInput = document.getElementById('apLast');
  const suggestionsEl = document.getElementById('apSuggestions');
  const badgeEl = document.getElementById('apSelectedBadge');

  function clearApSelection() {
    selectedExistingPlayerId = null;
    badgeEl.style.display = 'none';
    badgeEl.innerHTML = '';
  }

  apFirstInput.addEventListener('input', () => {
    clearApSelection();
    clearTimeout(window._apSearchDebounce);
    const q = apFirstInput.value.trim();
    if (q.length < 2) { suggestionsEl.style.display = 'none'; return; }
    window._apSearchDebounce = setTimeout(async () => {
      const data = await api(`/api/admin/players?search=${encodeURIComponent(q)}`);
      if (data.players.length === 0) { suggestionsEl.style.display = 'none'; return; }
      suggestionsEl.innerHTML = data.players.slice(0, 6).map((p) => `
        <div data-pick-player="${p.id}" data-pick-first="${p.first_name}" data-pick-last="${p.last_name}"
             style="padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:13px;">
          <span>${p.first_name} ${p.last_name} <span style="color:var(--ink-faint); font-size:11px;">#${p.player_number}</span></span>
          <span style="color:var(--accent);" title="Olemasolev kasutaja">★</span>
        </div>`).join('');
      suggestionsEl.style.display = 'block';
      suggestionsEl.querySelectorAll('[data-pick-player]').forEach((row) => {
        row.onclick = () => {
          apFirstInput.value = row.dataset.pickFirst;
          apLastInput.value = row.dataset.pickLast;
          selectedExistingPlayerId = Number(row.dataset.pickPlayer);
          suggestionsEl.style.display = 'none';
          badgeEl.style.display = 'block';
          badgeEl.innerHTML = `<span style="color:var(--accent); font-size:12px;">★ Olemasolev kasutaja (#${row.dataset.pickPlayer}) valitud - luuakse registreerimine ilma uut kontot loomata.</span>`;
        };
      });
    }, 300);
  });
  apLastInput.addEventListener('input', clearApSelection);
  document.addEventListener('click', (ev) => {
    if (!suggestionsEl.contains(ev.target) && ev.target !== apFirstInput) suggestionsEl.style.display = 'none';
  });

  document.getElementById('addPlayerBtn').onclick = async () => {
    try {
      await api('/api/admin/registrations/add-player', {
        method: 'POST',
        body: JSON.stringify({
          eventId: Number(eventId), divisionId: Number(document.getElementById('apDiv').value),
          firstName: apFirstInput.value, lastName: apLastInput.value,
          existingPlayerId: selectedExistingPlayerId,
        }),
      });
      renderTab();
    } catch (e) { document.getElementById('apError').textContent = e.message; }
  };
}

async function renderRounds(el) {
  el.innerHTML = `
    <div class="card">
      <h3>Ringid</h3>
      <div class="chip-list">${state.rounds.map((r) => `<div class="chip" style="cursor:pointer; ${r.id===state.selectedRoundId?'border-color:var(--accent);color:var(--accent);':''}" data-select-round="${r.id}">${r.name || 'Round ' + r.round_number}</div>`).join('') || '<span class="empty-note">Pole veel lisatud.</span>'}</div>
      <div class="row2" style="margin-top:12px;">
        <input id="newRoundNum" type="number" placeholder="Round number">
        <button class="btn" id="addRound">Lisa ring</button>
      </div>
      ${state.selectedRoundId ? `<a href="/control-center?round=${state.selectedRoundId}" target="_blank" class="btn secondary full" style="margin-top:12px; text-align:center; text-decoration:none;">📊 Ava Control Center (reaalajas ülevaade)</a>` : ''}
    </div>
  `;
  document.querySelectorAll('[data-select-round]').forEach((c) => c.onclick = () => { state.selectedRoundId = Number(c.dataset.selectRound); renderTab(); });
  document.getElementById('addRound').onclick = async () => {
    const roundNumber = Number(document.getElementById('newRoundNum').value);
    if (!roundNumber) return;
    await api(`/api/admin/events/${eventId}/rounds`, { method: 'POST', body: JSON.stringify({ roundNumber }) });
    loadEvent();
  };

  if (!state.selectedRoundId) return;

  const holesData = await api(`/api/admin/events/rounds/${state.selectedRoundId}/holes`);
  state.holes = holesData.holes;
  const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
  state.pools = poolsData.pools;
  const regsData = await api(`/api/admin/registrations/event/${eventId}`);
  state.registrations = regsData.registrations;

  el.innerHTML += `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;">Rajad (${state.holes.length})</h3>
        <button class="btn small" id="saveAllHoles" ${state.holes.length === 0 ? 'style="display:none;"' : ''}>Salvesta muudatused</button>
      </div>
      <div class="ok-msg" id="saveAllHolesStatus" style="min-height:16px; margin-top:6px;"></div>
      <table>
        <tr><th>#</th><th>Par</th><th>Park</th><th></th></tr>
        ${state.holes.map((h) => `
          <tr data-hole-row="${h.id}">
            <td><input type="number" class="editHn" value="${h.hole_number}" style="width:60px;"></td>
            <td><input type="number" class="editHp" value="${h.par}" style="width:60px;"></td>
            <td><select class="editHpark">${state.parks.map((p) => `<option value="${p.id}" ${p.id===h.park_id?'selected':''}>${p.name}</option>`).join('')}</select></td>
            <td style="white-space:nowrap;">
              <span style="cursor:pointer; color:var(--ink-faint);" data-delete-hole="${h.id}">✕</span>
            </td>
          </tr>`).join('') || ''}
      </table>
      <h3 style="margin-top:20px; padding-top:16px; border-top:1px solid var(--line);">🏞️ Lisa terve park korraga (nt "Harjumägi: rajad 1-14")</h3>
      <div class="row3">
        <div><label>Park</label><select id="rangePark">${state.parks.map((p) => `<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
        <div><label>Algus rada</label><input id="rangeStart" type="number" placeholder="nt 1"></div>
        <div><label>Lõpp rada</label><input id="rangeEnd" type="number" placeholder="nt 14"></div>
      </div>
      <div class="row2" style="margin-top:8px;">
        <div><label>Par (kõigile neile radadele, saab hiljem iga raja juures eraldi muuta)</label><input id="rangePar" type="number" placeholder="Par" value="3"></div>
        <div><label>&nbsp;</label><button class="btn secondary full" id="generateRange">Genereeri read allpool ↓</button></div>
      </div>

      <h3 style="margin-top:20px; padding-top:16px; border-top:1px solid var(--line);">➕ Lisa UUED rajad (see ei muuda ülal olevaid)</h3>
      <div style="display:grid; grid-template-columns:70px 70px 1fr 40px; gap:8px; font-size:11px; color:var(--ink-faint); margin-bottom:2px;">
        <span>Rada #</span><span>Par</span><span>Park</span><span></span>

    <div class="card">

        <div><label>Max mängijaid / pool</label><input id="bulkPoolMax" type="number" placeholder="Max mängijaid" value="4"></div>
        <div><label>Start rada (kõigile korraga loodud poolidele)</label><input id="bulkStartHole" type="number" placeholder="Start rada" value="1"></div>
      </div>

      <div style="display:flex; gap:16px; margin-top:20px; flex-wrap:wrap; align-items:flex-start;">

// DRAG-AND-DROP POOL BUILDER
// ---------------------------------------------------------------------------
function renderPoolBuilder() {
  const assignedPlayerIds = new Set(state.pools.flatMap((p) => (p.players || []).map((pl) => pl.player_id)));
  const search = (document.getElementById('unassignedSearch')?.value || '').toLowerCase();
  const unassigned = state.registrations.filter((r) =>
    !assignedPlayerIds.has(r.player_id) &&
    ['registered', 'confirmed'].includes(r.status) &&
    `${r.first_name} ${r.last_name}`.toLowerCase().includes(search)
  );

  document.getElementById('unassignedList').innerHTML = unassigned.length
    ? unassigned.map((r) => playerChip(r.first_name, r.last_name, r.id, null)).join('')
    : '<div class="empty-note">Kõik on poolidesse jaotatud.</div>';

  document.getElementById('poolGrid').innerHTML = state.pools.map((p) => `
    <div class="pool-drop" data-drop-zone="${p.id}" style="border:1px solid var(--line); border-radius:10px; padding:10px; min-height:90px; ${p.locked ? 'opacity:0.75;' : ''}">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:6px; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:3px;">
          <span style="font-size:10.5px; color:var(--ink-faint);">Pool</span>
          <input type="number" class="poolNumInput" data-pool-id="${p.id}" value="${p.pool_number}" style="width:46px; padding:3px 5px; font-size:12px;">
          <span style="font-size:10.5px; color:var(--ink-faint); margin-left:4px;">Start</span>
          <input type="number" class="poolStartInput" data-pool-id="${p.id}" value="${p.start_hole}" style="width:40px; padding:3px 5px; font-size:12px;">
          ${p.locked ? '<span style="font-size:12px;" title="Mängijad ei saa ise liituda">🔒</span>' : ''}
        </div>
        <span style="font-size:10.5px; color:${p.max_players && (p.players||[]).length >= p.max_players ? 'var(--bogey)' : 'var(--ink-faint)'};">
          ${(p.players||[]).length}${p.max_players ? '/'+p.max_players : ''}
        </span>
      </div>
      <div class="chip-list">
        ${(p.players || []).map((pl) => playerChip(pl.first_name, pl.last_name, pl.registration_id, pl.pool_player_id)).join('') || '<span class="empty-note" style="font-size:11px;">Lohista siia</span>'}
      </div>
      <div style="display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn secondary small" data-save-pool="${p.id}">Salvesta</button>
        <span data-toggle-lock="${p.id}" data-locked="${p.locked}" style="cursor:pointer; color:var(--ink-dim); font-size:11px;">${p.locked ? '🔓 Ava pool' : '🔒 Lukusta pool'}</span>
        <span data-delete-pool="${p.id}" style="cursor:pointer; color:var(--double); font-size:11px;">Kustuta pool</span>
      </div>
    </div>`).join('') || '<div class="empty-note">Loo kõigepealt vähemalt üks pool ülal.</div>';

  wireDragAndDrop();
  document.querySelectorAll('[data-save-pool]').forEach((btn) => {
    btn.onclick = async () => {
      const poolId = btn.dataset.savePool;
      const numInput = document.querySelector(`.poolNumInput[data-pool-id="${poolId}"]`);
      const startInput = document.querySelector(`.poolStartInput[data-pool-id="${poolId}"]`);
      await api(`/api/admin/pools/${poolId}`, {
        method: 'PATCH',
        body: JSON.stringify({ poolNumber: Number(numInput.value), startHole: Number(startInput.value) }),
      });
      const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
      state.pools = poolsData.pools;
      renderPoolBuilder();
    };
  });
  document.querySelectorAll('[data-delete-pool]').forEach((el) => {
    el.onclick = async () => {
      const ok = confirm('Kustutada see pool? Mängijad, kes seal olid, lähevad tagasi sidumata mängijate nimekirja.');
      if (!ok) return;
      await api(`/api/admin/pools/${el.dataset.deletePool}`, { method: 'DELETE' });
      const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
      state.pools = poolsData.pools;
      renderPoolBuilder();
    };
  });
  document.querySelectorAll('[data-toggle-lock]').forEach((el) => {
    el.onclick = async () => {
      const nowLocked = el.dataset.locked !== 'true';
      await api(`/api/admin/pools/${el.dataset.toggleLock}`, { method: 'PATCH', body: JSON.stringify({ locked: nowLocked }) });
      const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
      state.pools = poolsData.pools;
      renderPoolBuilder();
    };
  });
}

function playerChip(first, last, registrationId, poolPlayerId) {
  const payload = JSON.stringify({ registrationId, poolPlayerId }).replace(/"/g, '&quot;');
  return `<div class="chip" draggable="true" data-drag-payload="${payload}" data-chip-click="1" style="cursor:pointer;">${first} ${last}</div>`;
}

async function movePlayerToZone(payload, targetZone) {
  // Kui mängija oli juba mõnes poolis, eemalda ta sealt esmalt
  if (payload.poolPlayerId) {
    await api(`/api/admin/pools/players/${payload.poolPlayerId}`, { method: 'DELETE' });
  }
  // Kui sihtmärk on pärismaine pool (mitte "unassigned"), lisa ta sinna
  if (targetZone !== 'unassigned') {
    await api(`/api/admin/pools/${targetZone}/players`, {
      method: 'POST',
      body: JSON.stringify({ registrationId: payload.registrationId }),
    });
  }
  const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
  state.pools = poolsData.pools;
  renderPoolBuilder();
}

async function openSelfCorrectionLog() {
  const modal = document.getElementById('logModal');
  const body = document.getElementById('logModalBody');
  body.innerHTML = 'Laen...';
  modal.classList.add('show');
  try {
    const data = await api(`/api/admin/scores/self-corrections/${eventId}`);
    if (data.log.length === 0) {
      body.innerHTML = '<div class="empty-note">Ühtegi tagantjärgi parandust pole veel tehtud.</div>';
      return;
    }
    body.innerHTML = `
      <table>
        <tr><th>Mängija</th><th>Rada</th><th>Muudatus</th><th>Kes parandas</th><th>Millal</th></tr>
        ${data.log.map((l) => `
          <tr>
            <td>${l.first_name} ${l.last_name}</td>
            <td>${l.hole_number}</td>
            <td>${l.old_value} → <strong>${l.new_value}</strong></td>
            <td>${l.actor_first_name || '—'} ${l.actor_last_name || ''}</td>
            <td style="color:var(--ink-faint); font-size:11.5px;">${new Date(l.created_at).toLocaleString('et-EE')}</td>
          </tr>`).join('')}
      </table>`;
  } catch (e) {
    body.innerHTML = `<div class="error-msg">Viga: ${e.message}</div>`;
  }
}

function openMovePlayerModal(payload) {
  const modal = document.getElementById('movePlayerModal');
  const grid = document.getElementById('movePlayerGrid');
  const unassignBtn = payload.poolPlayerId
    ? `<button class="btn secondary full" id="moveToUnassigned" style="margin-bottom:12px;">Sidumata mängijad</button>`
    : '';
  const filterInput = state.pools.length > 12 ? `<input id="movePlayerFilter" placeholder="Otsi pooli numbrit..." style="margin-bottom:10px;">` : '';
  grid.innerHTML = unassignBtn + filterInput + `
    <div id="movePlayerButtons" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:8px;">
      ${state.pools.map((p) => `
        <button class="btn ${p.max_players && (p.players||[]).length >= p.max_players ? 'secondary' : ''}" data-move-to-pool="${p.id}" data-pool-number="${p.pool_number}" style="font-size:12px; padding:9px 6px;">
          Pool ${p.pool_number} (${(p.players||[]).length}${p.max_players ? '/'+p.max_players : ''})
        </button>`).join('')}
    </div>`;

  const closeAndMove = async (targetZone) => {
    modal.classList.remove('show');
    await movePlayerToZone(payload, targetZone);
  };
  const unassignEl = document.getElementById('moveToUnassigned');
  if (unassignEl) unassignEl.onclick = () => closeAndMove('unassigned');
  grid.querySelectorAll('[data-move-to-pool]').forEach((btn) => {
    btn.onclick = () => closeAndMove(btn.dataset.moveToPool);
  });
  const filterEl = document.getElementById('movePlayerFilter');
  if (filterEl) {
    filterEl.oninput = () => {
      const q = filterEl.value.trim();
      document.querySelectorAll('#movePlayerButtons [data-pool-number]').forEach((btn) => {
        btn.style.display = !q || btn.dataset.poolNumber.includes(q) ? '' : 'none';
      });
    };
    setTimeout(() => filterEl.focus(), 50);
  }
  modal.classList.add('show');
}

function wireDragAndDrop() {
  document.querySelectorAll('[data-chip-click]').forEach((chip) => {
    chip.onclick = () => {
      const payload = JSON.parse(chip.dataset.dragPayload.replace(/&quot;/g, '"'));
      openMovePlayerModal(payload);
    };
  });
  document.querySelectorAll('[data-drag-payload]').forEach((chip) => {
    chip.ondragstart = (e) => {
      e.dataTransfer.setData('text/plain', chip.dataset.dragPayload);
      e.dataTransfer.effectAllowed = 'move';
    };
  });

  document.querySelectorAll('[data-drop-zone]').forEach((zone) => {
    zone.ondragover = (e) => { e.preventDefault(); zone.style.background = 'rgba(255,107,53,0.08)'; };
    zone.ondragleave = () => { zone.style.background = ''; };
    zone.ondrop = async (e) => {
      e.preventDefault();
      zone.style.background = '';
      const raw = e.dataTransfer.getData('text/plain');
      if (!raw) return;
      const payload = JSON.parse(raw.replace(/&quot;/g, '"'));
      await movePlayerToZone(payload, zone.dataset.dropZone);
    };
  });
}

async function bulkCreatePools() {
  const btn = document.getElementById('bulkCreatePools');
  const statusEl = document.getElementById('bulkPoolStatus');
  const count = Number(document.getElementById('bulkPoolCount').value);
  const maxPlayers = Number(document.getElementById('bulkPoolMax').value) || null;
  const startHole = Number(document.getElementById('bulkStartHole').value) || 1;
  if (!count || count < 1) { statusEl.textContent = 'Sisesta, mitu pooli soovid luua.'; return; }
  if (count > 200) { statusEl.textContent = 'Liiga palju korraga (max 200).'; return; }

  btn.disabled = true;
  btn.textContent = 'Loon poole...';
  statusEl.style.color = 'var(--ink-dim)';

  const existingNumbers = state.pools.map((p) => p.pool_number);
  const nextNumber = existingNumbers.length ? Math.max(...existingNumbers) + 1 : 1;

  let created = 0;
  const errors = [];
  for (let i = 0; i < count; i++) {
    statusEl.textContent = `Loon poole... ${i + 1}/${count}`;
    try {
      await api(`/api/admin/pools/rounds/${state.selectedRoundId}`, {
        method: 'POST',
        body: JSON.stringify({ poolNumber: nextNumber + i, maxPlayers, startHole }),
      });
      created++;
    } catch (err) {
      errors.push(`Pool ${nextNumber + i}: ${err.message}`);
    }
  }

  btn.disabled = false;
  btn.textContent = 'Loo poolid korraga';
  statusEl.style.color = errors.length ? 'var(--double)' : 'var(--birdie)';
  statusEl.textContent = errors.length
    ? `Loodud ${created}/${count}. Vead: ${errors.slice(0, 3).join('; ')}${errors.length > 3 ? ' ...' : ''}`
    : `✓ Loodud ${created} pooli.`;

  const poolsData = await api(`/api/admin/pools/rounds/${state.selectedRoundId}`);
  state.pools = poolsData.pools;
  renderPoolBuilder();
}

function addHoleRow(presetNum, presetPar, presetParkId) {
  const container = document.getElementById('holeRows');
  const row = document.createElement('div');
  row.className = 'hole-input-row';
  const nextNum = presetNum ?? (container.children.length + state.holes.length + 1);
  const nextPar = presetPar ?? 3;
  row.innerHTML = `
    <input type="number" class="hn" placeholder="Rada" value="${nextNum}">
    <input type="number" class="hp" placeholder="Par" value="${nextPar}">
    <select class="hpark">${state.parks.map((p) => `<option value="${p.id}" ${presetParkId && p.id === presetParkId ? 'selected' : ''}>${p.name}</option>`).join('')}</select>
    <span style="cursor:pointer; color:var(--ink-faint);" onclick="this.parentElement.remove()">✕</span>`;
  container.appendChild(row);
}

function generateRangeRows() {
  const parkId = Number(document.getElementById('rangePark').value);
  const start = Number(document.getElementById('rangeStart').value);
  const end = Number(document.getElementById('rangeEnd').value);
  const par = Number(document.getElementById('rangePar').value) || 3;
  const errorEl = document.getElementById('rangeError');
  errorEl.textContent = '';

  if (!start || !end || start > end) {
    errorEl.textContent = 'Sisesta korrektne algus- ja lõpurada (algus peab olema väiksem või võrdne lõpuga).';
    return;
  }
  if (end - start > 200) {
    errorEl.textContent = 'Liiga suur vahemik korraga (max 200 rada).';
    return;
  }

  document.getElementById('holeRows').innerHTML = '';
  for (let n = start; n <= end; n++) {
    addHoleRow(n, par, parkId);
  }
}

async function saveHoles() {
  const rows = [...document.querySelectorAll('#holeRows .hole-input-row')];
  const holes = rows.map((r) => ({
    holeNumber: Number(r.querySelector('.hn').value),
    par: Number(r.querySelector('.hp').value),
    parkId: Number(r.querySelector('.hpark').value),
  })).filter((h) => h.holeNumber && h.par);
  if (holes.length === 0) return;
  try {
    await api(`/api/admin/events/rounds/${state.selectedRoundId}/holes`, { method: 'POST', body: JSON.stringify({ holes }) });
    renderTab();
  } catch (e) { document.getElementById('holesError').textContent = e.message; }
}

async function saveAllHoles() {
  const statusEl = document.getElementById('saveAllHolesStatus');
  const rows = [...document.querySelectorAll('[data-hole-row]')];
  if (rows.length === 0) return;

  statusEl.style.color = 'var(--ink-dim)';
  let saved = 0;
  const errors = [];
  for (const row of rows) {
    statusEl.textContent = `Salvestan... ${saved}/${rows.length}`;
    const holeNumber = row.querySelector('.editHn').value;
    try {
      await api(`/api/admin/events/holes/${row.dataset.holeRow}`, {
        method: 'PATCH',
        body: JSON.stringify({
          holeNumber: Number(holeNumber),
          par: Number(row.querySelector('.editHp').value),
          parkId: Number(row.querySelector('.editHpark').value),
        }),
      });
      saved++;
    } catch (err) {
      errors.push(`Rada ${holeNumber}: ${err.message}`);
    }
  }

  statusEl.style.color = errors.length ? 'var(--double)' : 'var(--birdie)';
  statusEl.textContent = errors.length
    ? `Salvestatud ${saved}/${rows.length}. Vead: ${errors.slice(0, 3).join('; ')}${errors.length > 3 ? ' ...' : ''}`
    : `✓ Kõik ${saved} rada salvestatud.`;

  setTimeout(renderTab, errors.length ? 3000 : 900);
}

async function createPool() {
  const poolNumber = Number(document.getElementById('poolNum').value);
  const startHole = Number(document.getElementById('poolStartHole').value) || 1;
  const maxPlayers = Number(document.getElementById('poolMaxPlayers').value) || null;
  const requireDoubleVerification = document.getElementById('poolDoubleVerify').checked;
  if (!poolNumber) return;
  await api(`/api/admin/pools/rounds/${state.selectedRoundId}`, { method: 'POST', body: JSON.stringify({ poolNumber, startHole, maxPlayers, requireDoubleVerification }) });
  renderTab();
}

// ---------------------------------------------------------------------------
// CONFLICTS
// ---------------------------------------------------------------------------
async function renderConflicts(el) {
  if (!state.selectedRoundId) { el.innerHTML = `<div class="card empty-note">Vali kõigepealt ring "Rajad & Poolid" alt.</div>`; return; }
  const data = await api(`/api/admin/scores/conflicts/round/${state.selectedRoundId}`);
  state.conflicts = data.conflicts;
  el.innerHTML = `
    <div class="card">
      <h3>Lahendamata konfliktid (${state.conflicts.length})</h3>
      ${state.conflicts.length === 0 ? '<div class="empty-note">Konflikte pole. 🎉</div>' : state.conflicts.map((c) => `
        <div style="border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px;">
          <div><strong>${c.first_name} ${c.last_name}</strong> · Rada ${c.hole_number}</div>
          <div style="font-size:12.5px; color:var(--ink-dim); margin:4px 0 10px;">Salvestatud: ${c.existing_value} · Üritati: ${c.attempted_value}</div>
          <div class="row2">
            <input type="number" class="resVal" placeholder="Õige tulemus" value="${c.existing_value}">
            <input class="resReason" placeholder="Põhjus">
          </div>
          <button class="btn small" style="margin-top:8px;" data-resolve="${c.id}">Lahenda</button>
        </div>`).join('')}
    </div>
  `;
  document.querySelectorAll('[data-resolve]').forEach((btn) => {
    btn.onclick = async () => {
      const card = btn.closest('div');
      const resolutionValue = Number(card.querySelector('.resVal').value);
      const reason = card.querySelector('.resReason').value;
      await api(`/api/admin/scores/conflicts/${btn.dataset.resolve}`, { method: 'PATCH', body: JSON.stringify({ resolutionValue, reason }) });
      renderTab();
    };
  });
}

loadEvent();
